    <h4 class="fw-bold">Overview</h4>
<p>Brinjal (Solanum melongena), also called eggplant or aubergine, is a widely cultivated vegetable in the Solanaceae family, which includes tomato, potato, and chili. Native to India, it has been grown for thousands of years in Asia before spreading globally. The plant is an herbaceous perennial, usually grown annually for its fruit, which varies in shape, size, and color—from glossy purple and green to white and striped varieties. Brinjal is important in Indian cuisine and consumed as curries, fries, or stuffed dishes. The fruit is rich in dietary fiber, antioxidants, and minerals like potassium, calcium, and iron. It contains nasunin, an anthocyanin with antioxidant properties beneficial for heart health and cell protection. Global demand is increasing due to nutritional benefits and adaptability to diverse climates. India is a leading producer, with West Bengal, Odisha, and Bihar dominating cultivation. Productivity depends on soil fertility, climate, and disease management. Sustainable practices such as integrated pest management and organic farming improve yield while maintaining soil health. Brinjal contributes significantly to rural income, making it an economically important crop for small-scale farmers.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Brinjal cultivation starts with selecting quality, disease-resistant seeds to ensure higher yields. Seeds are sown in nursery beds with fine tilth soil enriched with farmyard manure, at 400–500 grams per hectare. Rows are spaced 10–15 cm apart, lightly covered, and gently watered. Germination occurs within 7–10 days, and seedlings are ready for transplanting in 4–5 weeks at 10–15 cm height. Main fields are ploughed deeply, leveled, and enriched with well-decomposed compost. Transplanting is best in the evening to reduce shock. Plant spacing is 60 × 45 cm for small varieties and 75 × 60 cm for large ones. Mulching with straw or plastic retains moisture and suppresses weeds. Regular weeding and earthing up promote root development. Fertilization is done with nitrogen, phosphorus, and potassium (100:60:80 kg/ha). Intercropping with legumes improves soil nitrogen and prevents pests. Crop rotation with non-solanaceous plants like beans or maize breaks disease cycles, ensuring sustainable cultivation and high productivity.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Brinjal grows best in well-drained, fertile loamy soils rich in organic matter, with pH 5.5–6.8. Heavy clay soils hinder root growth and increase fungal infection risk. Fields should be ploughed 2–3 times, leveled, and enriched with 25–30 tons/ha of well-rotted organic manure. Compost enhances microbial activity, improving soil structure and nutrient availability. Sandy loam soils are ideal for drainage and moisture retention. Brinjal is moderately salinity-tolerant but sensitive to poor aeration. Soil testing is recommended to maintain balanced fertilization. Farmyard manure or vermicompost supports early plant vigor, and micronutrients like boron, zinc, and iron are crucial for fruit quality. Lime improves acidic soils. Green manuring and cover crops enhance organic matter and reduce erosion. Proper soil management ensures healthy roots, better nutrient uptake, and higher yield quality, which is vital for successful cultivation.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Brinjal is cultivated extensively in tropical and subtropical regions. In India, major producing states are West Bengal, Odisha, Bihar, Gujarat, Karnataka, and Andhra Pradesh, offering favorable temperatures and irrigation. The crop can grow year-round in mild-winter areas. Globally, China, the Philippines, Bangladesh, and Egypt also contribute significantly. Eastern and southern India dominate due to suitable humidity and soil fertility. Varieties are region-specific: ‘Pusa Purple Long’ in the north, ‘Arka Nidhi’ and ‘Arka Kusumakar’ in the south. High-altitude cultivation occurs in greenhouses. Regional adaptation of hybrids improves productivity and pest resistance. Proximity to urban markets enhances profitability, as brinjal is perishable. Its short duration (90–120 days) allows multiple cropping cycles. Regional agro-climatic conditions, variety choice, and planting timing largely determine yield and quality.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Brinjal requires consistent soil moisture, especially during flowering and fruiting. First irrigation is after transplanting. Subsequent intervals depend on soil and climate: 7–10 days in loamy soils, 4–5 days in sandy soils. Over-irrigation causes root rot and poor aeration. Drip irrigation delivers water to roots efficiently, conserving 40–50% water, reducing weeds, and allowing fertigation. Mulching minimizes evaporation. Adequate irrigation during flowering prevents flower drop and ensures uniform fruit set. In rainfed areas, supplemental irrigation from stored water or check dams is beneficial. Water stagnation must be avoided, as brinjal roots are sensitive. Irrigation scheduling across vegetative, flowering, and fruiting stages optimizes growth and yield. Sustainable water management improves efficiency and prevents soil salinity.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Brinjal thrives in warm climates with 25–35°C optimal temperatures. Frost and temperatures below 15°C inhibit flowering and fruiting. Long sunny days are essential for photosynthesis and healthy growth. Cool, cloudy weather during flowering reduces pollination. Moderate humidity (60–70%) is ideal; excessive humidity encourages fungal diseases like wilt and mildew. Tropical zones allow year-round cultivation, but summer and early winter give the best yields. Frost-free periods of at least three months are necessary. Windbreaks protect tender plants, and raised beds prevent waterlogging in high rainfall areas. Temperature fluctuations during flowering cause misshapen fruits. Protected cultivation using greenhouses or polyhouses ensures optimal conditions for consistent production.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Brinjal is prone to bacterial wilt (Ralstonia solanacearum), which causes sudden wilting without yellowing, spreading via soil and water. Phomopsis blight causes leaf spots and fruit rot. Verticillium and Fusarium wilts lead to yellowing and stunted growth. Damping-off affects seedlings. Powdery mildew appears as white fungal growth, reducing photosynthesis. Viral diseases like Little Leaf and Mosaic Virus deform leaves and lower fruit quality. Management includes crop rotation with non-host crops, resistant varieties, and field sanitation. Solarization of nursery beds kills pathogens. Seed treatment with carbendazim and soil drenching with copper oxychloride control fungi. Biological agents like Trichoderma harzianum and Pseudomonas fluorescens reduce soil-borne diseases. Proper drainage, balanced fertilization, and avoiding over-irrigation are key preventive measures. Early detection and integrated disease management ensure healthy crops and sustained productivity.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Major pests include Shoot and Fruit Borer (Leucinodes orbonalis), causing tunneling in fruits and stems. Field monitoring and removal of infested shoots reduce spread. Pheromone traps help early detection. Other pests include aphids, whiteflies, jassids, thrips, and red spider mites, which suck sap and weaken plants. Integrated Pest Management (IPM) combines cultural, biological, and chemical methods. Neem-based pesticides and botanical extracts are used in organic farming. Natural predators like ladybird beetles and lacewings control aphids. Excess nitrogen fertilizers attract pests and should be avoided. Bacillus thuringiensis (Bt) formulations control caterpillars effectively. Crop rotation and field hygiene prevent pest buildup. Bt brinjal resists fruit borers, increasing yield, but adoption depends on regional regulations. Trap cropping, intercropping with marigold, and light traps enhance sustainable pest management. Regular monitoring and judicious pesticide use maintain ecological balance, cost efficiency, and safe food production.</p>

    <h4 class="fw-bold">Overview</h4>
<p>Chilli (Capsicum annuum), a member of the Solanaceae family, is one of the most important spice crops cultivated worldwide. Originating from Central and South America, it was introduced to India by Portuguese traders in the 16th century and has become an essential part of Indian cuisine and culture. Valued for pungency, color, and flavor, its heat comes from capsaicin, an active alkaloid. The fruits vary in shape, size, and color—from green and red to yellow and orange—depending on the variety and maturity stage. Chilli is used fresh or dried to produce powders, flakes, and sauces. It also has medicinal benefits, stimulating appetite, aiding digestion, and offering antioxidant and anti-inflammatory properties. The plant is herbaceous, growing 40 cm–1.2 m tall, with self-pollinating white flowers. India is among the largest producers, consumers, and exporters, with Andhra Pradesh, Karnataka, Maharashtra, and Telangana as major contributors. Hybrid varieties and improved cultivation practices enhance yield, color, and disease resistance. Chilli supports the livelihoods of small and marginal farmers in tropical and subtropical regions, making it economically significant.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Successful chilli cultivation begins with selecting high-yielding, disease-resistant varieties suited to local climates, such as Guntur, Byadagi, Pusa Jwala, and hybrids. Seeds are sown in raised nursery beds with well-decomposed farmyard manure and sterilized soil to prevent damping-off. Seed rate is 1–1.2 kg/ha for direct sowing, 300–400 g/ha for transplanting. Germination occurs in 8–10 days under warm, moist conditions. Seedlings are transplanted after 4–5 weeks at 12–15 cm height with 5–6 leaves. Main fields are ploughed 2–3 times, leveled, and enriched with organic compost. Ridge and furrow planting ensures drainage and aeration. Spacing is 45 × 45 cm for irrigated crops and 60 × 60 cm for rainfed crops. Mulching with straw or polythene conserves moisture and reduces weeds. Intercropping with onion, garlic, or tomato enhances soil utilization and reduces pests. Fertilizers rich in nitrogen, phosphorus, and potassium are applied in split doses, supplemented with zinc and boron. Regular weeding, pruning, and staking promote healthy growth. Evening transplanting with light irrigation minimizes shock and ensures better establishment.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Chilli thrives in well-drained, fertile loamy soils with pH 6.0–7.0, rich in organic matter and moisture-holding capacity. Sandy loam soils favor early crops, while clay loam suits high yields under irrigation. Poor drainage and excessive salinity cause root diseases and stunted growth. Before sowing, fields are ploughed deeply to achieve fine tilth and remove weeds or stones. Incorporation of 20–25 tons/ha farmyard manure or compost improves fertility and structure. Soil solarization using transparent polythene for 3–4 weeks eliminates pathogens in nursery beds. Lime corrects acidity, gypsum improves alkaline soils, and green manure crops like cowpea or sunhemp enhance nitrogen content. Integrated nutrient management combining organic and inorganic fertilizers ensures optimal productivity. Soil aeration and avoiding water stagnation are critical to prevent fungal infections and root rot, supporting healthy seedlings and fruit development.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Chilli is cultivated in tropical and subtropical regions worldwide, with top producers including India, China, Mexico, Indonesia, and Thailand. In India, Andhra Pradesh, Karnataka, Telangana, Maharashtra, Tamil Nadu, and Madhya Pradesh contribute over 70% of national output. Famous Guntur and Byadagi chillies are known for color and pungency. Chilli grows in both irrigated and rainfed conditions. Coastal belts with moderate humidity favor vegetative growth, while dry interior regions produce high-capsaicin fruits. Northern India sows in October–November (rabi), southern regions in June–July (kharif). Cultivation up to 1,500 m altitude is suitable. Regional adaptation is key, with optimal drying conditions in export zones ensuring bright red color and long shelf life. Local marketing centers like Guntur and Byadagi serve as global trade hubs. Agro-climatic conditions, irrigation availability, and region-specific varieties largely determine yield and fruit quality.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Chilli requires regular moisture, especially during flowering and fruiting. First irrigation is immediately after transplanting, followed by light irrigation every 7–10 days depending on soil and weather. Over-irrigation promotes root diseases and lowers capsaicin content. Drip irrigation delivers water directly to roots, saving 40–50% water and enabling fertigation for efficient nutrient uptake. Adequate moisture during flowering prevents flower drop and shriveling. Mulching conserves soil moisture and suppresses weeds. In rainfed areas, contour bunding and mulching help retain moisture. Irrigation frequency is reduced during monsoons and increased in dry months. Soil moisture sensors or evapotranspiration-based scheduling ensures sustainable water use. Proper drainage prevents waterlogging, contributing to uniform fruit development, color retention, and high productivity.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Chilli thrives in warm, humid climates with optimal temperatures of 20–30°C. Frost, prolonged cold, or heavy rainfall adversely affects growth. Germination is best around 25°C; fruit setting is inhibited below 15°C or above 35°C. Full sunlight (8–10 hours/day) ensures photosynthesis and vibrant fruit color. High humidity during flowering encourages fungal infections and poor pollination. Moderate annual rainfall of 600–1,200 mm is ideal. Dry weather during ripening enhances color and reduces diseases. Regions with distinct wet and dry seasons allow year-round cultivation with irrigation. Windbreaks protect plants from desiccating winds and flower drop. Controlled environment farming in polyhouses or greenhouses supports uniform, export-quality chillies. Selecting proper sowing seasons minimizes temperature or humidity-induced losses and maximizes yield.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Chilli is vulnerable to fungal, bacterial, and viral diseases. Damping-off (Pythium and Rhizoctonia) affects nursery seedlings. Anthracnose (Colletotrichum capsici) causes fruit rot with dark spots. Powdery and downy mildews reduce photosynthesis. Fusarium and Verticillium wilts stunt growth and kill plants. Leaf curl virus and mosaic virus deform leaves and lower yield. Management includes disease-free seeds, resistant varieties, crop rotation, and field sanitation. Soil sterilization and seed treatment with carbendazim or copper oxychloride prevent fungal infections. Foliar sprays of neem oil and biological agents like Trichoderma harzianum control soil-borne pathogens. Proper spacing, drainage, and avoiding overhead irrigation minimize disease spread. Early detection and integrated management practices ensure sustainable, healthy crop production.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Pests include thrips, aphids, fruit borers, mites, whiteflies, and leaf miners. The fruit borer (Helicoverpa armigera) is most destructive, boring into fruits. Thrips and mites suck sap, causing leaf curling and discoloration. Integrated Pest Management (IPM) combines biological, cultural, and selective chemical control. Pheromone traps (12–15/ha) monitor borers. Neem-based biopesticides (5% neem seed extract or 2% neem oil) reduce sucking pests. Natural predators like lacewings and Trichogramma wasps maintain ecological balance. Avoiding excessive nitrogen prevents pest buildup. Regular inspections, removal of infested fruits, and crop rotation disrupt pest cycles. Selective insecticides like spinosad or emamectin benzoate are applied when needed. Bt chilli hybrids and biopesticides promote sustainable pest control. Preventive measures, timely monitoring, and organic alternatives ensure environmental safety and high fruit quality.</p>
`

    <h4 class="fw-bold">Introduction</h4>
<p>Carrot (Daucus carota subsp. sativus) is a biennial root vegetable of the Apiaceae family. While typically orange, cultivars also exist in purple, yellow, red, and white. Originating in Iran and Afghanistan, carrots were initially grown for aromatic leaves and seeds; modern orange carrots were developed in the Netherlands in the 16th–17th centuries. The orange color comes from beta-carotene, a precursor of vitamin A, essential for vision and immunity. Carrots are rich in dietary fiber, vitamin K, potassium, and antioxidants, while low in fat and calories. The plant grows 30–100 cm tall with finely divided, feathery leaves. The taproot consists of an outer cortex and inner xylem; high-quality carrots have a thick cortex and small core. Carrots are consumed raw, cooked, or processed into juices, soups, desserts, and baby foods. They also have medicinal and antioxidant properties, supporting health beyond nutrition. Carrots are economically important, contributing to both small and large-scale farming.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Carrots are propagated directly from seeds as transplanting can damage roots. Seeds are small and slow to germinate, taking 10–20 days. Soil should be finely tilled and free of stones. Seeds are sown 1–1.5 cm deep in rows spaced 30 cm apart, with 5–8 cm between plants. Early thinning ensures proper root development. Sowing time varies: October–December in northern India and July–September in southern regions. Full sunlight and cool growing conditions are essential. Regular weeding and loosening soil around plants prevent deformed roots. Fertilization should be balanced, with low nitrogen, moderate phosphorus, and high potassium; excess nitrogen causes hairy or forked roots. Organic manure or compost enhances fertility and flavor. Crop rotation with legumes improves soil nitrogen, while intercropping with onion or lettuce optimizes land use. Mulching conserves moisture and prevents weeds. In commercial farming, precision drills and sprinklers are used for uniform planting and irrigation.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Carrots thrive in deep, loose sandy loam or alluvial soil that is well-drained and rich in organic matter. Soil should be free from pebbles and hard clods to prevent root deformities. Ideal pH is 6.0–6.8, slightly acidic. Heavy clay or waterlogged soils cause forking and stunted growth. Ploughing 3–4 times achieves fine tilth. Incorporating 20–25 tons/ha of organic manure before sowing improves root quality. Raised beds or ridges improve drainage. Balanced nutrient management is critical: potassium deficiency reduces color and storage quality, while excess nitrogen promotes leaf over root growth. Soil solarization before sowing controls soil-borne pests. Periodic soil testing maintains nutrient balance. Crop rotation with cereals or legumes reduces nematode infestation and sustains soil fertility.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Carrots are cultivated in temperate and subtropical regions. In India, major areas include Punjab, Haryana, Karnataka, Uttar Pradesh, and Maharashtra. Northern hill regions prefer temperate varieties, while southern states grow tropical and Asiatic types. Globally, China, the United States, Uzbekistan, and Russia are top producers. Carrots are mainly grown as a winter crop in tropical regions and a summer crop in cooler zones. Altitudes from sea level to 2,500 meters support cultivation. In regions like Ooty and Kodaikanal, carrots can be grown year-round due to moderate climate. Regional adaptation allows early sowing in plains for harvest before summer heat, while high-altitude cultivation provides extended growing periods. Increasing demand from processing industries and export markets expands carrot cultivation.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Carrots require consistent soil moisture from sowing to harvest. Light and frequent irrigation ensures uniform germination and prevents cracking. First irrigation is immediately after sowing, followed by light watering every 5–7 days depending on soil type and weather. Excessive irrigation or water stagnation leads to root rot and forking. Drip irrigation provides uniform moisture and reduces weed growth, while sprinklers maintain soil moisture during germination. In sandy soils, irrigation intervals are shorter. Moisture stress during root development causes woody texture, and overwatering before harvest can split roots. Mulching retains soil moisture and minimizes evaporation. Adequate drainage prevents diseases like cavity spot and bacterial blight. Proper irrigation ensures smooth, high-quality roots and optimal yield.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Carrots are cool-season crops that grow best at temperatures of 16–21°C. Full sunlight ensures optimal root color and sugar accumulation. Temperatures above 30°C reduce pigmentation and increase bitterness, while frost can damage seedlings. Carrots prefer short-day conditions for root formation, with moderate humidity aiding growth. In tropical regions, carrots are grown in winter; in temperate zones, during spring and early summer. Prolonged heat causes premature bolting and poor root development. Windy and dry conditions can cause wilting; windbreaks or mulching help. Polyhouse cultivation supports off-season production. Climate-resilient varieties tolerate mild heat stress. Consistent temperature and adequate moisture throughout the growth period produce uniform, sweet, and deeply colored roots.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Carrots are affected by fungal, bacterial, and nematode diseases. Alternaria leaf blight causes dark brown leaf spots and reduces photosynthesis. Powdery mildew appears as white patches under dry conditions. Cavity spot (Pythium species) produces sunken lesions on roots. Bacterial leaf blight (Xanthomonas campestris) damages foliage in humid climates. Nematodes, especially Meloidogyne species, cause galled and deformed roots. Management includes crop rotation with non-host crops, deep plowing, and soil sterilization. Certified seeds treated with fungicides or bioagents like Trichoderma reduce infection. Good drainage and proper spacing minimize disease spread. Overhead irrigation should be avoided. Balanced fertilization and removal of diseased debris improve plant resistance. Disease-resistant varieties and timely field monitoring support sustainable carrot production.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Major pests include carrot flies, aphids, nematodes, and cutworms. Carrot flies lay eggs near roots, and larvae tunnel through roots, causing rot. Aphids suck sap, weakening plants and spreading viruses. Nematodes form galls on roots, and cutworms damage seedlings. Integrated Pest Management (IPM) combines crop rotation, biological control, and limited pesticide use. Intercropping with onion or garlic repels carrot flies. Neem oil and Beauveria bassiana sprays reduce pest populations. Sticky traps monitor aphids. Soil treatment with neem cake minimizes nematode attack. Maintaining field hygiene, removing plant residues, and deep plowing reduce pest habitats. Selective insecticides like imidacloprid may be used under supervision. Encouraging natural predators like ladybird beetles and parasitic wasps ensures long-term pest control. Consistent monitoring and organic repellents maintain pest-free, eco-friendly carrot cultivation.</p>

    <h4 class="fw-bold">Overview</h4>
<p>Papaya (Carica papaya) is a tropical fruit-bearing plant belonging to the Caricaceae family. Native to Central America and southern Mexico, it is now widely cultivated across tropical and subtropical regions worldwide. Papaya is known for its fast growth, early bearing nature, and high nutritional value. The fruits are rich in vitamins A, C, and E, and contain the enzyme papain, which aids digestion and has applications in food, cosmetic, and pharmaceutical industries. The plant is a soft-stemmed, short-lived perennial that resembles a tree due to its tall, unbranched stem and crown of large leaves. Papaya starts bearing fruits within 9–12 months of planting, making it a profitable crop. Fruits vary in size and shape, with flesh color ranging from yellow to orange or pinkish red. Papaya is consumed both ripe and unripe and is economically important in tropical horticulture.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Papaya is propagated mainly through seeds obtained from healthy, fully ripe fruits. Seeds are washed to remove the gelatinous coating, shade-dried, and treated with fungicides to prevent damping-off. Seeds are sown in nursery beds or polybags filled with well-drained soil mixed with farmyard manure. Germination occurs within 2–3 weeks. Seedlings aged 6–8 weeks and about 20–25 cm tall are transplanted into the main field. Pits of size 60 × 60 × 60 cm are prepared and filled with topsoil and organic manure. Spacing of 1.8 × 1.8 m or 2 × 2 m is followed depending on variety. Hermaphrodite varieties are preferred for uniform fruiting. Regular weeding, mulching, earthing up, and balanced fertilization support healthy growth. Wind protection is essential to prevent lodging.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Papaya grows best in well-drained, fertile soils rich in organic matter. Sandy loam, alluvial, and medium black soils are suitable, provided they are not waterlogged. The ideal soil pH ranges from 6.0 to 6.5. Heavy clay and saline soils are unsuitable as they cause root rot and poor growth. Land preparation includes deep ploughing and incorporation of 20–25 tons/ha of well-decomposed farmyard manure. Soil testing helps in proper nutrient management. Nitrogen promotes vegetative growth, phosphorus aids root development, and potassium improves fruit quality. Organic amendments such as compost and vermicompost enhance soil structure and moisture retention. Raised beds are recommended in high rainfall areas to improve drainage.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Papaya is widely cultivated in tropical and subtropical regions of the world. In India, major papaya-growing states include Andhra Pradesh, Karnataka, Gujarat, Maharashtra, Tamil Nadu, West Bengal, and Madhya Pradesh. The crop grows well at altitudes below 1000 meters where frost is absent. In northern India, papaya is planted during February–March or June–July, while in southern India it can be grown throughout the year. Globally, leading papaya-producing countries include India, Brazil, Indonesia, Nigeria, and Mexico. Coastal regions, river valleys, and well-irrigated dry zones provide ideal conditions. Regional selection of varieties depends on climate and disease prevalence.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Papaya requires a regular and uniform water supply due to its shallow root system. Irregular watering leads to flower drop and poor fruit development. Drip irrigation is the most efficient method, ensuring optimal soil moisture and allowing fertigation. During summer, irrigation is given every 5–7 days, while in winter it is provided every 10–15 days depending on soil and climate. Over-irrigation should be avoided as it causes root rot. Mulching reduces evaporation and conserves moisture. In heavy rainfall areas, raised beds prevent water stagnation. Consistent moisture during fruiting prevents cracking and ensures uniform fruit size and quality.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Papaya thrives in warm tropical and subtropical climates. The ideal temperature range for growth is 25–35°C. Temperatures below 15°C slow growth, while frost causes severe damage. The crop requires full sunlight for proper flowering and fruit sweetness. Annual rainfall of 1000–2000 mm is suitable, provided drainage is good. High humidity promotes growth but may increase disease incidence. Strong winds can damage plants, so windbreaks are recommended. Dry and sunny conditions during fruit ripening improve sugar content and color. Stable climatic conditions throughout the growth period are essential for high yield and quality fruits.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Papaya is affected by fungal, bacterial, and viral diseases. Anthracnose causes dark, sunken spots on fruits, reducing market value. Powdery mildew appears as white patches on leaves and reduces photosynthesis. Damping-off affects seedlings in nurseries. Root and stem rot caused by Phytophthora occurs under waterlogged conditions. Viral diseases like Papaya Ring Spot Virus cause leaf mottling and fruit deformation and are spread by aphids. Management includes using disease-free seeds, proper drainage, removal of infected plants, and spraying recommended fungicides or bioagents. Resistant varieties and field sanitation reduce disease incidence.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Major pests of papaya include papaya mealybug, fruit fly, aphids, whiteflies, thrips, and spider mites. Mealybugs suck plant sap, causing yellowing and fruit deformation. Fruit flies lay eggs in fruits, leading to internal damage. Aphids and whiteflies act as virus vectors. Integrated Pest Management practices include biological control using parasitoids, use of pheromone traps, neem oil sprays, and field sanitation. Intercropping and removal of infested plant parts reduce pest buildup. Chemical pesticides should be used only when necessary and within safe limits. Encouraging natural predators helps maintain ecological balance and ensures sustainable papaya production.</p>
`

    <h4 class="fw-bold">Overview</h4>
<p>Watermelon (Citrullus lanatus) is a widely cultivated fruit crop belonging to the Cucurbitaceae family and is native to tropical Africa. It has been domesticated for over 4,000–5,000 years and is now grown extensively in tropical and subtropical regions worldwide. The fruit is highly valued for its sweet, juicy flesh, which contains more than 90% water, making it an excellent source of hydration during hot seasons. Watermelon is rich in vitamins A and C and antioxidants such as lycopene, which supports heart health and reduces oxidative stress. Fruits vary in size, shape, and flesh color, including red, pink, yellow, and orange, while rinds are typically green with lighter stripes. Seeds may be black, brown, white, or absent in seedless varieties. Watermelon holds significant economic importance in countries like India, China, the United States, and Turkey. It supports rural livelihoods, especially in arid and semi-arid regions. Apart from fresh consumption, watermelon is processed into juices, candies, jams, and pickles, while seeds are used for roasting and oil extraction. Its adaptability, short duration, and high market demand make it one of the most popular summer fruits globally.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Watermelon cultivation starts with selecting high-quality seeds and preparing well-drained land. Fields are deeply plowed and leveled, and organic manure or compost is incorporated to improve soil fertility. Watermelons are grown either by direct seeding or by transplanting nursery-raised seedlings. Seeds are sown 2–3 cm deep in pits or raised beds, maintaining spacing of 2–3 meters between plants to allow vine spread. Mulching with dry straw or plastic sheets conserves soil moisture and suppresses weeds. Since watermelon is a creeping plant, adequate spacing ensures proper sunlight exposure and air circulation. Regular weeding and earthing-up strengthen root systems. Vine training and limited pruning help improve fruit quality and uniformity. Pollination, mainly carried out by bees, is essential for good fruit set. Crop rotation is practiced to prevent soil-borne diseases, and continuous cultivation in the same field is avoided. Proper nutrient management and timely monitoring ensure uniform fruit development and high yields.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Watermelon grows best in well-drained sandy loam or loamy soils rich in organic matter. The ideal soil pH ranges from 6.0 to 7.5, which supports optimal nutrient availability and root growth. Heavy clay or waterlogged soils are unsuitable as they restrict aeration and promote root diseases. Before sowing, deep plowing and incorporation of farmyard manure, compost, or green manure crops improve soil structure and fertility. Adequate levels of calcium and magnesium prevent physiological disorders, while phosphorus and potassium enhance fruit sweetness and shelf life. Excess nitrogen should be avoided as it promotes excessive vine growth at the expense of fruiting. Soil testing helps determine nutrient requirements and pH correction needs. Loose and friable soils allow deep root penetration and efficient water uptake. Soil solarization and crop rotation help reduce soil-borne pathogens and maintain long-term soil health.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Watermelon is cultivated across tropical, subtropical, and warm temperate regions worldwide. In India, major growing states include Karnataka, Tamil Nadu, Maharashtra, Andhra Pradesh, Uttar Pradesh, and Rajasthan. The crop is particularly suitable for riverbed cultivation and sandy loam soils with good sunlight exposure. Globally, China is the largest producer, followed by Turkey, Iran, Brazil, and the United States. African countries such as Egypt and Nigeria also contribute significantly. Watermelon is grown as both a rainfed and irrigated crop, depending on regional rainfall. In northern India, it is a popular summer crop, while in coastal and river basin areas it is grown during the rabi season. Hybrid varieties like Sugar Baby, Arka Jyoti, and Crimson Sweet are widely adopted for higher yields and better transportability. Its adaptability to diverse climatic conditions makes watermelon a valuable crop in both irrigated and dryland farming systems.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Watermelon requires consistent soil moisture for proper germination, flowering, and fruit development. Although moderately drought-tolerant, water stress during flowering and fruit setting significantly reduces yield and fruit size. Drip irrigation is the most efficient method, delivering water directly to the root zone and reducing water wastage. It also enables fertigation for efficient nutrient application. The first irrigation is given immediately after sowing, followed by watering every 3–5 days during early growth. Irrigation frequency is increased during flowering and fruit enlargement stages. Excess watering near maturity should be avoided to prevent fruit cracking and reduced sweetness. Mulching reduces evaporation and stabilizes soil temperature. Proper irrigation scheduling based on crop stage and soil type improves yield, fruit quality, and water-use efficiency.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Watermelon is a warm-season crop that thrives in hot and dry climates. The optimal temperature range for growth is 25°C to 35°C, and seed germination requires soil temperatures above 21°C. The crop is highly sensitive to frost and prolonged cold conditions. Bright sunlight and long day lengths enhance photosynthesis and sugar accumulation in fruits. A dry climate during fruit ripening improves sweetness and reduces disease incidence. Watermelon is best suited to semi-arid regions with controlled irrigation, as it cannot tolerate waterlogging. Raised beds and ridges are used in high-rainfall areas for better drainage. Windbreaks protect vines from damage and aid pollination. Regions with warm days and mild nights provide ideal conditions for high-quality watermelon production.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Watermelon is affected by fungal, bacterial, and viral diseases. Common fungal diseases include anthracnose, downy mildew, powdery mildew, and fusarium wilt, which cause leaf spots, defoliation, and vine wilting. Bacterial diseases such as bacterial fruit blotch and angular leaf spot lead to water-soaked lesions on fruits and leaves. Viral diseases like watermelon mosaic virus and cucumber mosaic virus cause leaf mottling, curling, and stunted growth. Disease management includes using resistant varieties, practicing crop rotation, and maintaining field sanitation. Seed treatment with fungicides helps prevent seed-borne infections. Proper spacing and avoiding overhead irrigation reduce humidity-related disease spread. Integrated disease management combining cultural, biological, and chemical methods ensures healthy crop growth and high-quality fruit production.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Major pests affecting watermelon include aphids, fruit flies, red pumpkin beetles, thrips, and leaf miners. Aphids and whiteflies suck plant sap and transmit viral diseases, while fruit flies cause direct damage by laying eggs inside fruits. Red pumpkin beetles attack young seedlings and foliage. Pest management starts with crop rotation, field sanitation, and removal of infested plant parts. Neem-based biopesticides and insecticidal soaps are effective against early infestations. Yellow sticky traps and pheromone traps help monitor and control flying pests. Biological control using natural predators like ladybird beetles reduces pest populations. Chemical pesticides are applied only when necessary, following recommended doses and rotation to prevent resistance. Integrated Pest Management practices ensure sustainable pest control and high-quality watermelon production.</p>
`

    <h4 class="fw-bold">Overview</h4>
<p>Spinach (Spinacia oleracea) is a leafy green flowering plant belonging to the family Amaranthaceae, native to central and western Asia. It is a highly nutritious vegetable known for its tender, dark green leaves that are consumed fresh, cooked, or processed. Spinach is rich in vitamins A, C, K, and folate, as well as minerals like iron, calcium, and magnesium. It also contains antioxidants such as lutein and beta-carotene, making it beneficial for eye health, immunity, and overall well-being. The plant grows as an annual and reaches a height of about 30 cm, producing smooth or crinkled leaves depending on the variety. Spinach originated in ancient Persia and spread across Asia and Europe over centuries. It thrives in temperate climates as a cool-season crop and can be grown year-round with proper care. Its short growth period of 35–45 days allows multiple harvests in a single season. Spinach is widely used in salads, soups, curries, and frozen food products. Due to its nutritional value, ease of cultivation, and high market demand, spinach is one of the most economically important leafy vegetables worldwide.</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>Spinach cultivation begins with selecting high-yielding, disease-resistant varieties such as Pusa Harit, All Green, and hybrid spinach. Seeds are sown directly in well-prepared beds with fine tilth and weed-free soil. Sowing is done at a depth of about 1.5 cm in rows spaced 20–30 cm apart, maintaining a plant-to-plant distance of 5–10 cm. For broadcast sowing, around 20–25 kg of seed per hectare is required, while line sowing needs 10–12 kg per hectare. Seeds are often soaked in water for 10–12 hours before sowing to enhance germination. Well-decomposed farmyard manure (20–25 t/ha) is applied as a basal dose. Germination occurs within 6–8 days. Regular weeding, hoeing, and thinning after 2–3 weeks promote healthy growth. The first cutting is done 25–30 days after sowing, followed by subsequent harvests every 20 days. Successive sowing at fortnightly intervals ensures continuous production. Spinach can be cultivated in open fields, polyhouses, or hydroponic systems, and crop rotation with legumes improves soil health and yield.</p>

<h4 class="fw-bold mt-3">Soil</h4>
<p>Spinach grows best in well-drained, fertile loamy soils rich in organic matter. The ideal soil pH ranges from 6.0 to 7.5, which supports optimal nutrient uptake. Sandy loam soils are preferred for early crops, while heavier soils can be used for later sowings if drainage is adequate. Waterlogging adversely affects spinach, causing root rot and poor growth; hence raised beds are recommended in poorly drained areas. The field should be plowed 2–3 times to achieve fine tilth, and organic manure such as compost or farmyard manure (20–25 t/ha) should be incorporated before sowing. A general fertilizer recommendation is 50 kg nitrogen, 25 kg phosphorus, and 25 kg potassium per hectare. Half of the nitrogen and full doses of phosphorus and potassium are applied at sowing, while the remaining nitrogen is top-dressed after the first cutting. Organic matter enhances leaf color and quality. Mulching helps conserve moisture and suppress weeds. Proper soil management ensures sustainable productivity and high-quality spinach yield.</p>

<h4 class="fw-bold mt-3">Region</h4>
<p>Spinach is cultivated in temperate, subtropical, and tropical regions across the world. It originated in ancient Persia and spread to India, China, and Europe. Major spinach-producing countries include China, the United States, Japan, Turkey, and India, with China contributing the majority of global production. In India, spinach is grown in almost all states, especially Uttar Pradesh, Maharashtra, Punjab, Karnataka, and Tamil Nadu. It is cultivated as a winter crop in plains and as a summer crop in hilly regions. Spinach adapts well to diverse climatic zones, making it suitable for both home gardens and commercial farming. It is also an important export vegetable in frozen and dehydrated forms. Regional variety selection and seasonal planning play a key role in achieving consistent yield and quality.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>
<p>Spinach requires frequent and light irrigation to maintain consistent soil moisture due to its shallow root system. Pre-sowing irrigation ensures uniform germination, followed by irrigation every 4–5 days during vegetative growth. In sandy soils, watering may be needed every 2–3 days, while clay soils require less frequent irrigation. Over-irrigation should be avoided as it leads to waterlogging, root diseases, and yellowing of leaves. Furrow and sprinkler irrigation methods are commonly used, while drip irrigation is preferred in polyhouses for efficient water use. Mulching helps reduce evaporation and conserve moisture. Critical stages for irrigation include germination, early growth, and after each cutting. Proper irrigation scheduling improves leaf tenderness, yield, and quality.</p>

<h4 class="fw-bold mt-3">Climate Requirements</h4>
<p>Spinach is a cool-season crop that grows best under mild climatic conditions. The optimum temperature range for growth is 15–20°C, though it can tolerate temperatures as low as 5°C. High temperatures above 30°C cause premature bolting, leading to bitter leaves and reduced quality. Spinach prefers full sunlight but can tolerate partial shade. Shorter day lengths favor leaf production, while longer days induce flowering. Moderate humidity and good air circulation reduce disease incidence. Light frost can be tolerated by mature plants, but severe frost damages tender leaves. In warmer regions, shade nets and suitable varieties help mitigate heat stress. Controlled environments such as greenhouses allow year-round cultivation. Proper climate management ensures high yield and nutritional quality.</p>

<h4 class="fw-bold mt-3">Diseases</h4>
<p>Spinach is affected by fungal, bacterial, and viral diseases. Common diseases include downy mildew, leaf spot, damping-off, and fusarium wilt. Downy mildew causes yellow patches on leaves with grey mold underneath, especially in humid conditions. Leaf spot results in brown lesions, reducing market quality. Damping-off affects seedlings under excessive moisture, while fusarium wilt causes yellowing and wilting of mature plants. Viral diseases such as cucumber mosaic virus are transmitted by aphids. Disease management includes using certified disease-free seeds, practicing crop rotation, ensuring good drainage, and maintaining field sanitation. Bio-fungicides like Trichoderma and neem-based products provide eco-friendly control. Resistant varieties and integrated disease management practices ensure healthy spinach production.</p>

<h4 class="fw-bold mt-3">Pest Control and Prevention</h4>
<p>Major pests of spinach include aphids, leaf miners, cutworms, and armyworms. Aphids suck sap and transmit viral diseases, while leaf miners create serpentine tunnels in leaves. Cutworms damage seedlings at the soil surface, and armyworms feed heavily on foliage. Preventive measures include maintaining field hygiene, removing weeds, and encouraging natural predators such as ladybird beetles and lacewings. Neem oil and neem seed kernel extract are effective organic controls. Yellow sticky traps help monitor aphid populations. Crop rotation and intercropping with pest-repellent plants reduce infestations. In severe cases, selective insecticides may be applied as per recommendations. Integrated pest management ensures sustainable spinach cultivation with minimal chemical residue.</p>

<h4 class="fw-bold mt-3">Irrigation Techniques</h4>

</p>

<h4 class="fw-bold mt-3">Diseases</h4>

</p>

<h4 class="fw-bold mt-3">Plantation Techniques</h4>
<p>
Foxtail millet is mainly grown as a rainfed crop but can also be irrigated. It is sown by broadcasting or line sowing, with 22–30 cm row spacing and 8–10 cm between plants. Land is ploughed 2–3 times and leveled, and seeds are often treated with fungicides or bioagents. Seed rate is 8–10 kg/ha. Transplanting 20–25-day-old seedlings is practiced in irrigated fields. Application of 10–15 tons/ha of farmyard manure and balanced NPK fertilizers (40:20:20 kg/ha) is recommended. Timely weeding, intercultivation, thinning, and intercropping with legumes enhance yield. Crop matures in 75–90 days depending on variety and conditions.

    <h4 class="fw-bold">Overview</h4>
    <p>Saffron (Crocus sativus L.) is one of the most precious and expensive spices in the world, valued for its deep color, distinct aroma, and unique flavor. It belongs to the Iridaceae family and is primarily cultivated for its bright crimson stigmas, which are dried to produce saffron threads. Each saffron flower has three stigmas, and around 150,000 flowers are needed to produce just one kilogram of dried saffron, which explains its high market value. Saffron has been used for more than 3,500 years across various cultures for culinary, medicinal, and cosmetic purposes. It contains important chemical components like crocin, picrocrocin, and safranal, responsible for its coloring strength, taste, and aroma respectively. Apart from being used as a spice and natural dye, saffron is also known for its medicinal benefits such as improving digestion, boosting mood, and treating respiratory and skin conditions. The crop requires careful handling and harvesting since the flowers bloom for a very short duration during autumn, and the stigma must be plucked by hand before drying. Iran leads the global saffron production, followed by India (Kashmir), Spain, Greece, and Morocco. Due to its labor-intensive cultivation, low yield, and sensitivity to climate, saffron remains one of the world’s most luxurious agricultural products.</p>

    <h4 class="fw-bold mt-3">Plantation Techniques</h4>
    <p>Saffron propagation is done through corms because the plant is sterile and does not produce viable seeds. The corms are selected from healthy, disease-free plants and planted in well-prepared soil beds during the summer months (June to August). Each corm produces 6–8 new daughter corms, which are used for future propagation. The field is plowed deeply and mixed with organic manure before planting. Corms are placed about 10–15 cm deep and spaced around 10 cm apart in rows. Raised beds are often preferred for better drainage and aeration. Weeding and hoeing are necessary to maintain clean fields and avoid competition for nutrients. Mulching with dry grass or organic material helps retain soil moisture and prevent erosion. The flowering begins 60–90 days after planting, typically in late October or November. Harvesting is one of the most delicate processes and is performed manually every morning as soon as the flowers bloom. The stigmas are carefully separated from the flowers and dried under controlled temperature and humidity. Proper drying determines the quality and aroma of the final product. After harvesting, the fields are lightly irrigated, and corms remain in the soil until the next cycle. Periodic rotation of fields and use of fresh corms ensure sustained productivity.</p>

    <h4 class="fw-bold mt-3">Soil</h4>
    <p>Saffron thrives best in well-drained, fertile, and loose-textured soils rich in organic matter. Sandy loam or clay-calcareous soil with good water retention but no waterlogging tendency is ideal. The soil pH should range between 6.0 and 8.0 for optimal growth. Proper aeration is crucial since water stagnation can lead to corm rot and other fungal infections. Before planting, the soil is plowed deeply (30–40 cm) and enriched with decomposed farmyard manure (FYM) or compost at 15–20 tons per hectare. Raised beds improve drainage and prevent moisture accumulation. In regions with heavy clay soil, adding sand or organic amendments enhances porosity and reduces compaction. Soil testing before planting is recommended to adjust nutrient levels, especially for phosphorus and potassium, which influence flowering and pigment development. Nitrogen fertilizers should be applied in moderate quantities since excessive nitrogen encourages vegetative growth rather than flowering. Crop rotation with legumes helps maintain soil fertility and break pest cycles. Saffron fields should not be used continuously for many years; after 3–4 cropping cycles, corms are lifted, and the field is left fallow or planted with other crops for 1–2 years to restore fertility. Maintaining ideal soil structure, nutrient balance, and moisture control ensures high-quality stigmas with better color and aroma.</p>

    <h4 class="fw-bold mt-3">Region</h4>
    <p>Saffron is mainly cultivated in Iran, India (particularly Jammu and Kashmir), Spain, Greece, Morocco, and parts of Italy and Afghanistan. Iran accounts for nearly 90% of the global production due to its favorable semi-arid climate and centuries-old cultivation expertise. In India, the Pampore region of Jammu and Kashmir is famously called the “Saffron Town of India” for its high-quality saffron. Spain produces the famous La Mancha saffron known for its rich aroma, while Greece cultivates Kozani saffron with a strong color and flavor. Mediterranean regions with mild winters and dry summers provide ideal conditions for this crop. Saffron is typically grown in altitudes ranging from 1,500 to 2,500 meters above sea level, where the temperature variation between day and night supports flower initiation. The soil and climate conditions must be specific; too much humidity or continuous rainfall can damage the corms, whereas long dry spells can reduce flowering. In recent years, experimental saffron cultivation has begun in parts of Himachal Pradesh and Uttarakhand in India due to suitable climatic conditions. Globally, saffron remains an important cash crop for rural farmers in arid and semi-arid areas, contributing significantly to the local economy through domestic sales and exports.</p>

    <h4 class="fw-bold mt-3">Irrigation Techniques</h4>
    <p>Saffron requires moderate irrigation, as both drought and excess moisture are harmful. In regions with sufficient autumn rainfall, such as Kashmir, natural precipitation fulfills most water needs. However, in drier regions like Iran and Spain, controlled irrigation systems such as drip or sprinkler irrigation are adopted to maintain optimal soil moisture. The first irrigation, called “tehreer,” is given before flowering to promote bloom initiation. Subsequent light irrigations are provided during the vegetative phase, particularly in winter when the plants grow leaves. Over-irrigation can cause fungal infections and corm decay, so moisture levels must be carefully monitored. Raised beds are preferred in areas with heavy soils to prevent water stagnation. In dry climates, mulching helps conserve soil moisture. During summer dormancy (when leaves dry up), irrigation is completely stopped to allow the corms to rest underground. The timing of irrigation greatly influences flower quality and yield. Farmers also use moisture sensors to optimize irrigation frequency and quantity. Sustainable water management is essential, as excessive watering reduces stigma quality, while insufficient irrigation results in poor flower emergence. Hence, precise and minimal irrigation, combined with good drainage, forms the key to healthy saffron cultivation.
</p>

    <h4 class="fw-bold mt-3">Climate</h4>
    <p>Saffron thrives in regions with a temperate and semi-arid climate. It requires cold winters and dry, warm summers. Ideal temperatures range between 15°C and 25°C during the growing season, though saffron can tolerate extremes from –10°C in winter to 40°C in summer. The plant’s life cycle includes dormancy during summer, vegetative growth in autumn and winter, and flowering in autumn. Rainfall before flowering is beneficial as it stimulates bloom, but excessive rain or frost can damage flowers and stigmas. Saffron requires full sunlight and cannot grow well under shade. In areas with too much humidity, fungal diseases such as corm rot may occur. Altitudes between 1,500 and 2,500 meters with well-drained soils are ideal. Long days and moderate nights favor pigment formation in stigmas, resulting in better quality saffron. Climate also affects the intensity of color and aroma—regions with cooler temperatures and higher altitude tend to produce saffron with higher crocin and safranal content. Hence, maintaining suitable climatic conditions and proper timing of agricultural operations ensures high yield and premium quality saffron threads.</p>

    <h4 class="fw-bold mt-3">Diseases</h4>
    <p>Saffron crops are susceptible to several fungal, bacterial, and viral diseases, primarily caused by poor drainage, infected corms, or excessive moisture. The most common disease is corm rot (caused by Fusarium oxysporum and Rhizoctonia crocorum), which leads to decaying corms and wilting leaves. Leaf rust and leaf blotch can appear during humid conditions, reducing photosynthetic activity. Nematode infestations also weaken plants and reduce yields. Disease prevention starts with selecting disease-free corms and sterilizing them before planting. Proper field sanitation, crop rotation, and solarization of soil before planting minimize pathogen buildup. Avoiding waterlogging and maintaining optimal moisture levels help reduce fungal spread. If infection occurs, affected corms should be removed and destroyed. Bio-fungicides such as Trichoderma viride and neem-based formulations can be used as eco-friendly alternatives to chemical treatments. Monitoring fields regularly during the growing season helps detect early signs of disease and allows timely intervention. Balanced nutrition, good aeration, and organic soil management strengthen plant immunity and help reduce susceptibility to infections.
</p>

<h4 class="fw-bold mt-3">Pest Control and Management</h4>
<p>Pests that commonly affect saffron include rodents (rats, mice), birds, and insects that feed on corms or flowers. Rodents can severely damage stored and field-grown corms, while birds often peck at flowers. Preventive measures include using wire mesh, physical traps, and biological repellents. Neem oil sprays deter insects naturally without harming pollinators. Crop rotation and field sanitation minimize pest habitat buildup. Fungal biocontrol agents such as Bacillus subtilis and Trichoderma harzianum help improve plant health and resistance. Maintaining a clean field with no residual organic waste prevents rodents and insects from nesting. Post-harvest, corms should be stored in dry, ventilated places away from pests. Farmers also use natural predators like owls and cats to control rodent populations. Chemical pesticides are avoided since saffron stigmas absorb residues that can lower quality. Instead, integrated pest management (IPM) practices are encouraged—combining biological control, cultural methods, and limited safe chemical use. Through consistent monitoring, pest-resistant practices, and organic maintenance, saffron farmers can ensure sustainable and high-quality yields year after year.<p>
  `

// Load all crops by default
document.addEventListener('DOMContentLoaded', () => renderCrops('All'));


    // Render crop cards
    const cropGrid = document.getElementById('cropGrid');
     crops.forEach((c) => {
       const card = document.createElement('div');
       card.className = 'bg-white rounded-xl shadow crop-card overflow-hidden';
       card.innerHTML = `
         <div class="crop-card">
           <img src="${c.image}" alt="${c.name}" loading="lazy" />
           <div class="p-3 text-center">
             <h3 class="text-lg font-semibold text-green-700">${c.name}</h3>
           </div>
         </div>
       `;
       card.addEventListener('click', () => {
         document.getElementById('cropModalLabel').innerText = c.name;
        document.getElementById('cropModalImage').src = c.image;
         document.getElementById('cropModalContent').innerHTML = c.guide;
         new bootstrap.Modal(document.getElementById('cropModal')).show();
      });
       cropGrid.appendChild(card);
    });

    // Optional: pre-load weather for a default city
    // fetchWeather('Bangalore'); // uncomment to auto-load

  })();
  
  </script>
  

</body>

</html>
