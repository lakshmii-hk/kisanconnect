    async function fetchWeather(city) {
      if (!OPENWEATHER_API_KEY || OPENWEATHER_API_KEY === "REPLACE_WITH_YOUR_KEY") {
        weatherSection.innerHTML = '<p class="text-red-600">Please set OPENWEATHER_API_KEY in the page script.</p>';
        return;
      }
      weatherSection.innerText = 'Fetching weather...';
      try {
        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${OPENWEATHER_API_KEY}&units=metric`);
        const data = await res.json();
        if (data.cod !== 200) {
          weatherSection.innerHTML = `<p class="text-red-600">Weather error: ${data.message}</p>`;
          return;
        }
        weatherSection.innerHTML = `
          <h3 class="text-2xl font-bold">${data.name} — ${data.weather[0].main}</h3>
          <p class="text-lg">${data.weather[0].description}</p>
          <p class="text-xl font-semibold">🌡️ ${data.main.temp}°C</p>
          <p>💧 Humidity: ${data.main.humidity}% | 🌬️ Wind: ${data.wind.speed} m/s</p>
        `;
      } catch (err) {
        console.error(err);
        weatherSection.innerHTML = '<p class="text-red-600">Failed to fetch weather.</p>';
      }
    }

    weatherBtn.addEventListener('click', () => {

        guide: `
          <h4 class="fw-bold">Overview</h4>
          <p>Rice (Oryza sativa) is one of the most important cereal crops in the world, feeding more than half of the global population daily. It is primarily cultivated in Asian countries such as India, China, Indonesia, Bangladesh, Vietnam, and Thailand. The crop plays a crucial role in food security, employment, and rural livelihoods. Rice originated in the tropical and subtropical regions of Asia about 9,000 years ago, with archaeological evidence tracing its domestication to the Yangtze River Valley in China. Over time, various species and varieties evolved, including Oryza sativa indica and Oryza sativa japonica, which differ in grain size, texture, and climatic adaptability.
Nutritionally, rice provides carbohydrates for energy, moderate protein, small quantities of essential amino acids, and vitamins such as thiamine, niacin, and riboflavin. While white rice is more common, brown rice and parboiled rice offer higher nutritional benefits due to retained fiber and micronutrients.
Rice cultivation has also become central to research and biotechnology. Scientists have developed high-yielding, drought-tolerant, and pest-resistant varieties through hybridization and genetic modification. The International Rice Research Institute (IRRI) and other organizations have made significant contributions toward sustainable rice production systems. Moreover, rice straw and husk are utilized for biofuel, compost, and animal feed, reducing waste. In recent years, innovations like precision agriculture, remote sensing, and smart irrigation systems have been integrated into rice farming to enhance productivity while conserving resources. Thus, rice remains not only a staple food but also a key agricultural commodity that sustains economies, supports biodiversity, and ensures global food security.</p>

          <h4 class="fw-bold mt-3">Plantation Techniques</h4>
          <p>Rice cultivation requires specific plantation techniques adapted to soil, water, and climate conditions. The most common methods are transplanting, direct seeding, and the System of Rice Intensification (SRI). Transplanting involves raising seedlings in nurseries for 20–30 days before replanting them into puddled fields, which helps in proper spacing, easier weed control, and healthy crop establishment. Although labor-intensive, it ensures higher yields under controlled irrigation. Direct seeding, on the other hand, is more water-efficient and time-saving; pre-germinated seeds are sown directly into prepared fields using broadcasting or drilling methods. This technique is suitable in regions with limited labor or water resources but requires careful weed management. The SRI method, developed in Madagascar, focuses on using young seedlings, wider spacing, intermittent irrigation, and organic fertilizers to enhance root growth and yield while reducing input costs. Field preparation is critical for successful plantation—farmers plow and level the land to create a soft, even surface that retains water uniformly. Constructing bunds around fields helps conserve water and prevent soil erosion. Modern machinery like mechanical transplanters, seed drills, and weeders has improved efficiency and precision in planting. Quality seed selection is another vital step; certified seeds with high germination rates ensure strong, uniform crops. Seeds are often treated with fungicides or bio-agents to prevent early-stage infections. Timely sowing, ideal spacing (typically 20 × 20 cm for SRI), and proper nursery management significantly influence yield. In recent years, farmers have adopted sustainable techniques like laser land leveling and precision planting, which save resources and improve productivity. Overall, efficient plantation techniques combining traditional knowledge and modern technology ensure better crop establishment, higher yields, and reduced environmental impact.</p>

          <h4 class="fw-bold mt-3">Soil</h4>
          <p>Rice thrives best in fertile clayey or loamy soils capable of retaining water and supporting continuous submergence, as its growth demands standing water for much of the cultivation period. The ideal soil pH ranges between 5.5 and 7.0, which ensures optimal nutrient absorption and microbial activity. Before planting, fields are thoroughly plowed, puddled, and leveled to make the soil soft, compact, and suitable for transplanting or direct seeding. Puddling helps create a thin hardpan below the surface that prevents excessive percolation of water, conserves nutrients, and suppresses weeds. Incorporating organic matter such as green manure, compost, or farmyard manure enhances soil structure, aeration, and fertility. Balanced fertilization is essential for healthy crop development; nitrogen promotes vegetative growth, phosphorus strengthens root formation, and potassium improves disease resistance and grain filling. Micronutrients like zinc, sulfur, and iron are equally crucial for maintaining plant vigor. Farmers are advised to perform soil testing before each cropping season to detect nutrient deficiencies, salinity, or pH imbalance and to apply fertilizers accordingly. Integrated Nutrient Management (INM) practices that combine organic, chemical, and biofertilizers help sustain soil health over time. Crop rotation with legumes or pulses naturally replenishes nitrogen levels and prevents pest buildup. In coastal regions, saline-tolerant rice varieties such as Pokkali or CSR-30 are cultivated, while proper drainage systems are installed to avoid water stagnation in heavy rainfall zones. Mulching and contour bunding techniques are useful in upland rice fields to prevent soil erosion and moisture loss. Healthy soil not only boosts productivity but also supports biodiversity, enhances water retention, and ensures the sustainability of rice ecosystems for future cultivation cycles.</p>

          <h4 class="fw-bold mt-3">Region</h4>
          <p>Rice is grown across diverse ecological and geographical regions, each with distinct climatic and soil characteristics. Asia accounts for over 90% of global rice production, with India, China, Indonesia, Vietnam, Thailand, and Bangladesh leading the output. In India, major rice-growing regions include West Bengal, Uttar Pradesh, Punjab, Andhra Pradesh, Tamil Nadu, Odisha, and Bihar, where favorable monsoon conditions and fertile plains support extensive cultivation. Globally, rice ecosystems are categorized into irrigated lowland, rainfed lowland, upland, and flood-prone systems. Irrigated lowlands, found in river basins like the Ganges, Mekong, and Nile, rely on controlled irrigation and produce high yields. Rainfed lowlands depend heavily on monsoon rainfall and are vulnerable to drought or flooding, while upland rice grows in hilly areas with direct rainfall and good drainage. Flood-prone regions cultivate deepwater or floating rice varieties that can survive submergence. In northern India, rice is primarily a Kharif crop sown with the onset of monsoon (June to November), while southern states, with irrigation support, grow two to three crops annually, including Rabi and summer rice. Popular regional varieties include Basmati from North India, Sona Masuri from Andhra Pradesh, and Ponni from Tamil Nadu, each known for distinct grain quality and aroma. Outside Asia, countries such as Brazil, Nigeria, Egypt, and the southern United States also contribute significantly to global rice production. This vast geographical adaptability demonstrates rice’s versatility as a crop capable of thriving under diverse climatic zones. Regional variations in rainfall, soil type, and cultural practices have given rise to thousands of local varieties, each suited to unique environmental conditions and consumer preferences, ensuring global food diversity and stability.</p>

          <h4 class="fw-bold mt-3">Irrigation techniques</h4>
          <p>Rice requires abundant water for optimal growth, demanding about 1200–1500 millimeters during its growing period. Traditionally, rice fields are kept flooded under 5–10 centimeters of standing water through continuous flooding or basin irrigation. This helps in weed suppression, temperature regulation, and nutrient availability. However, with increasing water scarcity, more sustainable irrigation techniques have emerged. The Alternate Wetting and Drying (AWD) method, promoted by the International Rice Research Institute, allows fields to partially dry before re-flooding. A simple perforated tube inserted in the field helps farmers monitor water depth. AWD reduces water use by 25–30%, minimizes methane emissions, and maintains yield levels. In upland or water-limited regions, sprinkler and drip irrigation systems are introduced to deliver precise water amounts, reducing wastage and improving efficiency. In hilly regions, contour bunding and terracing prevent soil erosion while conserving water. Traditional methods like canal irrigation, check dams, and rainwater harvesting continue to play a major role in rural areas. Critical stages of rice growth—transplanting, tillering, panicle initiation, and flowering—require consistent moisture, while excess water during grain ripening can be drained to prevent fungal diseases. Modern tools like soil moisture sensors, automated pumps, and weather-based irrigation scheduling have made water management more efficient. Additionally, integrating solar-powered irrigation systems provides energy-efficient water supply in remote regions. Maintaining proper irrigation ensures healthy plant growth, better nutrient uptake, and higher productivity. Sustainable irrigation techniques not only conserve water but also contribute to environmental protection and climate resilience. Thus, the shift from traditional flooding to smart water management is essential for future-ready rice farming.</p>

          <h4 class="fw-bold mt-3">Climate Requirements</h4>
          <p>Rice is a tropical and subtropical crop that flourishes in warm, humid environments. The ideal temperature range for its growth is between 20°C and 37°C, with the optimum being 30°C during vegetative and flowering stages. Temperatures below 16°C slow germination, while above 40°C cause pollen sterility and reduced grain formation. Rice requires a rainfall of 100–200 centimeters annually, though irrigated systems compensate for lesser rainfall. It grows best in areas with high humidity, bright sunshine for 5–7 hours daily, and windless conditions during flowering to ensure successful pollination. The crop can be grown from sea level to altitudes of 2000 meters depending on the variety. Lowland rice thrives in flooded plains, while upland varieties grow on well-drained slopes relying on rainfall. The growing season varies with location—India cultivates rice mainly in the Kharif season (June–November), while in southern and eastern regions, additional Rabi or Boro crops are grown with irrigation. Climate change has introduced new challenges such as unpredictable monsoons, droughts, and heat stress, which affect yield and grain quality. Farmers are now adopting climate-resilient strategies like drought-tolerant or flood-tolerant varieties, alternate wetting irrigation, and crop diversification to adapt. The success of rice farming largely depends on maintaining an appropriate balance of temperature, rainfall, and humidity throughout the growing cycle. Ideal climatic conditions ensure strong vegetative growth, timely flowering, and good grain filling. Thus, understanding regional climate patterns and adapting cultivation practices accordingly is vital for stable and sustainable rice production, particularly in the face of global environmental changes.</p>

          <h4 class="fw-bold mt-3">Disease</h4>
          <p>Rice is susceptible to various diseases caused by fungi, bacteria, and viruses, which can severely reduce yield and grain quality. Among the most destructive are rice blast, bacterial leaf blight, sheath blight, and tungro virus. Rice blast, caused by Magnaporthe oryzae, affects leaves, nodes, and panicles, producing grayish lesions that hinder photosynthesis. High humidity and fluctuating temperatures favor its spread, and resistant varieties or fungicides like tricyclazole are commonly used to control it. Bacterial leaf blight, caused by Xanthomonas oryzae pv. oryzae, begins as water-soaked lesions on leaf edges that turn yellow and wilt, spreading rapidly through rain or irrigation water. Preventive measures include using clean seeds, resistant cultivars, and copper-based bactericides. Sheath blight, caused by Rhizoctonia solani, produces irregular lesions near the waterline, thriving in dense crops with poor air circulation. Proper spacing, balanced fertilization, and fungicide application can limit the damage. Rice tungro virus, transmitted by leafhoppers, causes stunted growth and yellow-orange leaves. Controlling vectors and removing infected plants helps manage its spread. Other diseases such as brown spot, stem rot, and false smut can also affect yield. Integrated Disease Management (IDM) practices combining resistant varieties, crop rotation, field sanitation, and biological control agents are the most sustainable approach. Avoiding excessive nitrogen fertilizers, ensuring proper drainage, and regular monitoring prevent disease outbreaks. Early detection and timely action play a crucial role in minimizing losses. By adopting IDM and resistant cultivars, farmers can achieve healthier crops and sustainable rice production even in disease-prone regions.</p>

          <h4 class="fw-bold mt-3">Pest control and Management</h4>
          <p>Rice faces attacks from numerous pests that threaten productivity, including stem borers, brown planthoppers, leaf folders, gall midges, rice bugs, and armyworms. The stem borer is one of the most destructive pests; its larvae bore into stems, causing dead hearts and whiteheads that reduce yield. Light traps, pheromone traps, and biological agents like Trichogramma wasps help control infestations. The brown planthopper (BPH), which sucks sap from the plant base, causes hopper burn and transmits viral diseases such as tungro. Maintaining field hygiene, controlling nitrogen application, and conserving natural predators like spiders and mirid bugs are effective preventive steps. Leaf folders roll leaves and feed on them, reducing photosynthesis, while rice bugs suck grain sap, affecting quality. Armyworms can destroy fields rapidly if left unchecked. Integrated Pest Management (IPM) is the most effective and eco-friendly approach, combining cultural, mechanical, biological, and chemical control methods. Cultural practices include crop rotation, timely sowing, weed removal, and field sanitation. Biological control uses natural predators, parasitoids, and microbial pesticides such as Bacillus thuringiensis. Chemical control is used only when pest populations exceed economic thresholds, ensuring minimal harm to beneficial insects. Eco-friendly pest control alternatives like neem oil sprays and pheromone traps are gaining popularity. Regular field monitoring, water management, and use of resistant varieties also reduce pest incidence. Educating farmers about pest life cycles, safe pesticide use, and biological control improves sustainability. A balanced ecosystem with controlled pest populations ensures healthy rice growth, high yields, and long-term environmental protection.</p>
        `

          <p>Wheat (Triticum aestivum) is one of the most significant cereal crops grown and consumed across the world. It belongs to the Poaceae family and serves as the staple food for nearly 35% of the global population. Wheat is primarily valued for its grains, which are ground into flour and used in making bread, chapati, pasta, noodles, biscuits, and numerous bakery products. It provides a major source of carbohydrates and contains around 12–14% protein, along with essential vitamins and minerals such as iron, zinc, and magnesium. The presence of gluten gives wheat dough its elasticity, making it ideal for baking. The wheat plant is an annual grass that grows between 60–150 cm in height, with narrow green leaves and hollow stems. The flowering head, known as a spike, contains small florets that form grains after pollination. Wheat is highly adaptable to various climatic and soil conditions, which makes it one of the most widely cultivated crops globally. Major producers include China, India, Russia, and the United States. Wheat has been cultivated for thousands of years, with evidence tracing back to the Fertile Crescent of ancient Mesopotamia. Today, it remains essential not only for food security but also for the economy, supporting millions of farmers and industries such as milling and bakery production. Its by-products like straw are used as cattle feed and biofuel, making wheat a multipurpose crop with immense global importance.</p>

          <h4 class="fw-bold mt-3">Plantation Techniques</h4>
          <p>The plantation of wheat involves several systematic steps to ensure good yield and high-quality grain production. The land should be well-prepared through deep plowing and harrowing to create a fine seedbed with good soil tilth. The field must be leveled properly to avoid waterlogging. Wheat is generally sown in the rabi season—October to December in India—when the temperature is moderate. High-quality certified seeds of high-yielding and disease-resistant varieties should be selected. Common sowing methods include broadcasting, drilling, and dibbling, though the seed drill method is most efficient as it ensures uniform depth and spacing. The recommended seed rate varies from 100 to 125 kg per hectare depending on the variety and soil type. Seeds should be sown at a depth of 4–5 cm for optimal germination. Fertilization plays a vital role in achieving better yields; nitrogen, phosphorus, and potassium should be applied as per soil test results. Organic manure enhances soil health and provides long-term fertility. Weed control during the early growth period is critical to prevent nutrient competition. Timely irrigation at critical stages such as crown root initiation and grain filling significantly boosts yield. Crop rotation with legumes helps maintain soil nitrogen and prevents pest build-up. Modern farming also includes using precision drills and mechanized harvesters for efficiency. Proper plantation techniques, when combined with quality seeds, balanced nutrition, and timely irrigation, can significantly increase productivity and profitability in wheat cultivation.</p>

          <h4 class="fw-bold mt-3">Soil</h4>
          <p>Wheat grows best in fertile, well-drained loamy and clay-loam soils that retain sufficient moisture during the growing season. Such soils allow proper root development and aeration, ensuring good nutrient absorption. The ideal soil pH for wheat cultivation is between 6.0 and 7.5, meaning slightly acidic to neutral conditions are preferred. Saline or highly alkaline soils are not suitable as they interfere with nutrient uptake and stunt growth. Before sowing, soil should be tested for nutrient content to determine the right fertilizer dosage. Adding organic matter such as compost, green manure, or farmyard manure improves soil structure, enhances microbial activity, and boosts fertility. Crop rotation is beneficial because continuous wheat cultivation can deplete soil nutrients. Leguminous crops like pulses enrich the soil by fixing nitrogen, thereby improving the next wheat crop’s productivity. Proper drainage systems are also important because waterlogging can lead to root rot and fungal infections. In dry areas, moisture conservation techniques like minimum tillage and mulching are used to preserve soil moisture. Soil preparation should ensure uniform leveling for efficient irrigation. Balanced fertilization with nitrogen, phosphorus, and potassium is necessary for maintaining soil fertility. Overall, maintaining soil health through organic amendments, proper rotation, and balanced nutrient application ensures sustainable wheat cultivation with higher yields and quality grains.</p>

          <h4 class="fw-bold mt-3">Region</h4>
          <p>Wheat is cultivated in a wide range of regions around the world due to its adaptability to different climates. The crop thrives particularly well in temperate regions with cool winters and moderate rainfall. Major wheat-growing regions include North India (Punjab, Haryana, Uttar Pradesh, Madhya Pradesh), the Indo-Gangetic plains, and parts of Rajasthan. Globally, it is extensively cultivated in China, the United States, Russia, Canada, and parts of Europe. In India, the wheat belt lies between latitudes 30°N and 45°N. The ideal altitude for cultivation ranges from sea level up to 3,000 meters depending on local climate. Wheat performs best in areas with distinct winter and spring seasons, where cool temperatures during early growth promote tillering and warm, dry conditions during maturity help grain development. Irrigated plains, where water availability is consistent, are ideal for large-scale wheat farming. The crop’s adaptability to semi-arid conditions has also made it suitable for regions like Western Australia and parts of North Africa. India’s northwestern states contribute nearly 80% of the nation’s total production due to favorable soil and climate conditions. The regional distribution of wheat cultivation has been shaped by availability of irrigation, soil fertility, and suitable temperature ranges during critical growth phases. This wide adaptability makes wheat a globally significant crop that supports millions of livelihoods across diverse agro-climatic regions.</p>

          <h4 class="fw-bold mt-3">Irrigation techniques</h4>
          <p>Irrigation is a key factor in wheat cultivation as water availability directly influences yield and grain quality. Wheat requires 30–40 cm of water throughout its growing period, depending on soil type and climatic conditions. The critical stages for irrigation include crown root initiation (20–25 days after sowing), jointing, booting, flowering, and grain filling. A shortage of water during these stages can drastically reduce yield. Traditionally, flood irrigation was used, but it leads to water wastage and soil salinity. Modern techniques like sprinkler and drip irrigation are increasingly preferred as they ensure uniform water distribution and efficient usage. In areas with sufficient rainfall, supplemental irrigation is applied during dry spells. The frequency of irrigation depends on soil moisture; loamy soils require less frequent watering compared to sandy soils. Proper land leveling ensures even distribution of water, preventing stagnation. In canal-irrigated regions, fields are divided into small plots for better management. Farmers are encouraged to adopt the “check basin” method to control water flow. The use of sensors and automated systems in precision irrigation helps optimize water use and improve crop health. Maintaining adequate soil moisture during tillering and avoiding excess irrigation during maturity prevent lodging and disease occurrence. Efficient irrigation not only improves yield but also enhances fertilizer use efficiency, ensuring sustainability in wheat production.</p>

          <h4 class="fw-bold mt-3">Climate</h4>
          <p>Wheat is a temperate crop that requires cool and dry weather for its growth and development. The ideal temperature for germination ranges from 20°C to 25°C, while for tillering and vegetative growth, 16°C to 22°C is optimal. During grain filling and ripening, a warmer temperature of around 25°C to 30°C is suitable. Extremely high temperatures above 35°C during the ripening stage can reduce grain quality and yield. Wheat prefers regions with moderate rainfall between 30 and 90 cm annually, evenly distributed across the growing season. However, excess rainfall or humidity can cause fungal diseases and lodging. The crop requires bright sunshine, particularly during grain formation, for proper starch accumulation. Frost during flowering or early growth can damage seedlings and reduce productivity. Hence, wheat is usually grown during the winter (rabi) season in India when the climate is cool and dry. Areas with well-distributed rainfall and dry weather during harvest are ideal for high-quality grain production. The crop’s adaptability to different climatic zones, from temperate Europe to subtropical India, makes it highly versatile. However, changing climate patterns, such as heat waves and irregular rainfall, pose new challenges to wheat farmers, necessitating the development of climate-resilient varieties and adaptive farming practices</p>

          <h4 class="fw-bold mt-3">Diseases</h4>
          <p>Wheat is susceptible to several fungal, bacterial, and viral diseases that can significantly affect yield and grain quality. The most common fungal diseases include rusts—leaf rust (Puccinia triticina), stem rust (Puccinia graminis), and stripe rust (Puccinia striiformis). These diseases cause yellow or brown pustules on leaves and stems, leading to reduced photosynthesis and poor grain filling. Powdery mildew, caused by Erysiphe graminis, appears as white powdery patches on leaves and stems. Smut diseases, such as loose smut and covered smut, affect the kernels, replacing them with dark spores. Fusarium head blight causes shriveled grains and produces harmful toxins. Among bacterial diseases, bacterial leaf blight and black chaff are notable, while barley yellow dwarf virus causes stunted growth and yellowing. Disease management involves using resistant varieties, timely sowing, crop rotation, and fungicidal sprays. Maintaining proper plant spacing and avoiding excessive nitrogen fertilizer also help reduce disease incidence. Removing infected crop residues and deep plowing destroy fungal spores in the soil. Seed treatment with fungicides like carbendazim prevents seed-borne infections. Integrated disease management combining cultural, chemical, and biological measures ensures sustainable control and minimizes yield losses.</p>

          <h4 class="fw-bold mt-3">Pest control and Management</h4>
          <p>Pests pose a significant threat to wheat crops by damaging roots, stems, leaves, and grains. Common pests include termites, aphids, armyworms, cutworms, and wheat stem borers. Termites attack roots and stems, leading to wilting and poor growth, especially in dry areas. Aphids suck sap from young shoots and transmit viral diseases. Armyworms and cutworms feed on foliage, reducing photosynthetic activity, while borers damage stems, hindering nutrient transport. Preventive measures include deep plowing to expose and destroy eggs and larvae, crop rotation to break pest cycles, and timely sowing to escape peak pest periods. Maintaining field hygiene, removing weeds, and destroying infected residues also reduce pest habitats. Biological control using predators like ladybird beetles for aphids or Trichogramma for borers is effective. Chemical control involves using recommended insecticides such as chlorpyrifos, malathion, or imidacloprid, but these should be applied judiciously to avoid resistance and environmental harm. Farmers are encouraged to adopt integrated pest management (IPM), which combines cultural, biological, and minimal chemical measures. Regular monitoring, use of pheromone traps, and promoting natural enemies help maintain pest populations below economic thresholds. Sustainable pest control not only protects yield but also ensures long-term ecological balance in wheat-growing systems.</p>

          <h4 class="fw-bold">Overview</h4>

          <h4 class="fw-bold mt-3">Plantation Techniques</h4>
          <p>Plantation techniques play a vital role in achieving high maize productivity. The crop is propagated through seeds, which are sown directly into well-prepared fields. Land preparation involves two to three ploughings followed by harrowing to create a fine tilth suitable for seed germination. The ideal sowing time varies with region—June to July for the Kharif season and October to November for the Rabi season in India. The recommended seed rate is 20–25 kg per hectare for hybrid maize and 15–20 kg per hectare for composite varieties. Seeds are typically planted in rows with spacing of 60–75 cm between rows and 20–25 cm between plants, ensuring optimal sunlight interception and airflow. Prior to sowing, seeds should be treated with fungicides such as Thiram or Carbendazim (2.5 g/kg seed) to prevent fungal infections. Fertilizer application follows the recommended dose of 120:60:40 kg NPK per hectare, with nitrogen applied in split doses—one-third at sowing, one-third at knee height, and the remaining at tasseling. Weed control is essential during the early growth stages, achieved through manual weeding or the use of pre-emergence herbicides like Atrazine. Mulching can also be applied to retain soil moisture and suppress weeds. Intercropping maize with legumes such as soybean or cowpea enhances soil fertility by fixing atmospheric nitrogen. Irrigation should be scheduled at critical growth stages like germination, knee height, tasseling, and grain filling. Adopting precision farming practices, such as mechanized seed drills and GPS-guided sowing, ensures uniform planting depth and better yield. Proper plantation techniques not only enhance productivity but also reduce resource wastage, making maize cultivation more efficient and sustainable for modern farmers.</p>

          <h4 class="fw-bold mt-3">Soil</h4>
          <p>Maize thrives best in fertile, well-drained soils with good moisture-holding capacity. Loamy and sandy loam soils rich in organic matter are considered ideal for maize cultivation. The optimal soil pH ranges between 5.5 and 7.5, as extreme acidity or alkalinity adversely affects nutrient availability and root development. Soils with good aeration and moderate water retention capacity promote healthy root growth, leading to improved nutrient uptake. Heavy clay soils are generally unsuitable as they cause waterlogging, which restricts oxygen supply to the roots. Before planting, deep ploughing helps to break hard pans and improve root penetration. The application of organic manure such as farmyard manure (FYM) or compost at 8–10 tons per hectare during land preparation enriches the soil with essential micronutrients. Balanced fertilization is key to achieving high yields, as maize is a heavy feeder of nitrogen. Phosphorus promotes strong root development, while potassium enhances disease resistance and grain quality. Soil testing is recommended before cultivation to determine the nutrient status and adjust fertilizer dosages accordingly. Micronutrients like zinc, boron, and magnesium are also essential for optimal growth. In alkaline soils, foliar sprays of zinc sulfate can correct micronutrient deficiencies. Mulching and cover cropping improve soil structure, reduce erosion, and enhance microbial activity. Conservation tillage practices help retain soil moisture and prevent degradation. Maintaining ideal soil conditions not only ensures higher productivity but also promotes environmental sustainability. Continuous maize cultivation should be avoided; instead, crop rotation with legumes or pulses should be practiced to maintain soil fertility and structure. Thus, soil health management forms the foundation for successful maize farming.</p>

          <h4 class="fw-bold mt-3">Region</h4>
          <p>Maize is cultivated worldwide and adapts well to various agro-climatic zones. Major producers include the United States, China, Brazil, Argentina, and India. In India, maize is grown extensively in Karnataka, Madhya Pradesh, Andhra Pradesh, Bihar, and Rajasthan. It is a dominant kharif crop but can also be cultivated in rabi and spring seasons under irrigation. Regions with moderate rainfall and good drainage provide ideal conditions. Maize performs well in both plains and hilly terrains, depending on the variety used. Highland varieties are adapted for cooler climates, while hybrid and composite varieties perform well in tropical lowlands. Regional selection ensures better yield and resistance to local pests and diseases. Areas with good market access, processing units, and storage infrastructure also enhance the profitability and sustainability of maize farming.</p>

          <h4 class="fw-bold mt-3">Irrigation techniques</h4>
          <p>Maize requires adequate soil moisture, particularly during germination, tasseling, and grain filling stages. Although it can tolerate short dry periods, moisture stress during flowering drastically reduces yield. Drip and sprinkler irrigation systems are preferred for water efficiency and uniform distribution. In traditional furrow irrigation, water is applied between rows, but excessive flooding should be avoided to prevent root rot. The first irrigation is given immediately after sowing, followed by light irrigations at 10–12 day intervals depending on soil type and weather. Drip systems can save up to 40–50% water while improving yield. Maintaining soil moisture at 60–70% field capacity ensures optimum plant growth. Mulching with crop residues helps conserve water and reduce evaporation losses. Good drainage is equally important, as waterlogging severely affects maize roots.</p>

          <h4 class="fw-bold mt-3">Climate</h4>
          <p>Maize thrives in warm tropical and subtropical climates with temperatures between 18°C and 27°C. It is sensitive to frost and extreme heat above 35°C. The crop requires 500–800 mm of rainfall well distributed over its growing period. High humidity and excessive rainfall during flowering may affect pollination and cause fungal infections. Maize requires abundant sunshine for photosynthesis and dry weather during harvest to reduce grain moisture. Short-day varieties suit tropical areas, while long-day types are suitable for temperate zones. Temperature and photoperiod influence flowering and grain formation. In India, it is mainly cultivated during the kharif season under rainfed conditions, while rabi maize is grown with irrigation. Selecting region-specific hybrids ensures good adaptation, disease resistance, and high productivity under diverse climates.</p>

          <h4 class="fw-bold mt-3">Diseases</h4>
          <p>Maize is affected by several fungal, bacterial, and viral diseases. Major fungal diseases include leaf blight, downy mildew, rust, and stalk rot, which cause leaf spots, lodging, and reduced grain filling. Bacterial stalk rot leads to wilting and poor ear development, while viral diseases like maize streak virus cause chlorotic streaks and stunted growth. Using certified disease-free seeds, crop rotation, and resistant hybrids are key preventive measures. Fungicidal sprays like mancozeb and carbendazim are effective against blights and rusts. Proper field sanitation, balanced fertilization, and timely irrigation reduce disease incidence. Avoiding continuous maize cropping and ensuring adequate plant spacing improve air circulation, minimizing fungal infections. Monitoring and early detection help farmers take preventive action to protect yield and quality.</p>

          <h4 class="fw-bold mt-3">Pest control and Management</h4>
          <p>Common maize pests include stem borers, fall armyworms, aphids, cutworms, and white grubs. These insects damage leaves, stems, and cobs, affecting yield and grain quality. Integrated Pest Management (IPM) is the best control approach, combining biological, cultural, and chemical methods. Crop rotation, deep plowing, and timely weeding reduce pest breeding. Biological control using Trichogramma wasps and Bacillus thuringiensis (Bt) formulations targets larvae effectively. Light and pheromone traps help monitor and reduce adult populations. Spraying neem-based biopesticides offers eco-friendly pest control. When pest density exceeds threshold levels, selective insecticides like chlorantraniliprole may be used judiciously. Maintaining field hygiene, removing infected plants, and planting Bt maize varieties minimize pest attack, ensuring healthy and sustainable maize production.</p>

          <h4 class="fw-bold mt-3">Plantation techniques</h4>

          <h4 class="fw-bold mt-3">Soil</h4>
          <p>Sugarcane requires fertile, well-drained soils with good moisture-holding capacity. Ideal soils include deep loam, clay loam, or alluvial soils enriched with organic matter. The optimum pH for sugarcane growth ranges between 6.0 and 7.5, though it can tolerate slightly acidic or alkaline conditions. Soil preparation begins with deep ploughing and leveling to ensure proper aeration and drainage, as sugarcane roots are sensitive to waterlogging. Incorporating organic manures like farmyard manure (FYM) or green manure (20–25 tons/ha) before planting enhances soil fertility and microbial activity. Sugarcane is a heavy feeder of nutrients, particularly nitrogen, phosphorus, and potassium, which are essential for stalk elongation and sucrose accumulation. Therefore, balanced fertilization is necessary to maintain high yields. Micronutrients like zinc, iron, and boron are also vital; deficiency can lead to chlorosis and reduced sugar content. In areas with poor soil fertility, soil testing is recommended to determine nutrient status before applying fertilizers. Crop rotation with legumes helps restore soil nitrogen and prevent pest buildup. Organic mulching conserves soil moisture, reduces temperature fluctuations, and minimizes erosion. The use of biofertilizers such as Azospirillum and Azotobacter enhances nitrogen fixation and improves soil structure. In saline-prone regions, gypsum or sulfur amendments help reclaim degraded land. Modern precision agriculture technologies, including IoT-based soil sensors, enable real-time monitoring of soil moisture, temperature, and pH to optimize irrigation and fertilization schedules. Maintaining ideal soil conditions ensures sustainable sugarcane cultivation, promotes environmental balance, and maximizes economic returns for farmers.</p>

          <h4 class="fw-bold mt-3">Region</h4>
          <p>Sugarcane is a tropical crop but can also be grown in subtropical regions with suitable irrigation and temperature. Major sugarcane-producing countries include India, Brazil, China, Thailand, and Pakistan. In India, it is widely cultivated in Uttar Pradesh, Maharashtra, Karnataka, Tamil Nadu, and Bihar. Coastal and river basin regions with rich alluvial soils are ideal for cultivation. In southern India, regions like Mandya (Karnataka) and Erode (Tamil Nadu) are major sugarcane belts. The regional climate and rainfall pattern influence the choice of variety and harvest period. For example, tropical regions allow two ratoon crops, while subtropical regions typically grow one. Suitable regional selection ensures high productivity, better sugar recovery, and reduced pest or disease pressure. Access to irrigation, transport, and sugar mills also affects the profitability and sustainability of cultivation.</p>

          <h4 class="fw-bold mt-3">Irrigation techniques</h4>
          <p>Sugarcane requires abundant and well-distributed water throughout its growth period. On average, it needs 1500–2500 mm of water annually. Modern drip irrigation systems are preferred as they ensure uniform moisture, save up to 40% water, and improve fertilizer efficiency. Traditional furrow irrigation is common but can lead to waterlogging and wastage if not managed properly. The first irrigation is given immediately after planting, followed by regular watering every 7–10 days depending on soil and weather conditions. Critical irrigation stages include germination, tillering, grand growth, and ripening. Water stress during these stages can drastically reduce cane yield and sugar recovery. Proper field drainage is equally important to avoid root diseases. In water-scarce areas, micro-irrigation and fertigation are adopted to ensure sustainable water management and improve crop productivity.</p>

          <h4 class="fw-bold mt-3">Climate</h4>

          <h4 class="fw-bold mt-3">Diseases</h4>

          <h4 class="fw-bold mt-3">Pest control & Management</h4>

          <h4 class="fw-bold mt-3">Plantation techniques</h4>
          <p>Cotton is propagated directly from seeds, and proper land preparation is crucial for good germination. The soil is plowed and leveled to ensure good drainage and aeration. Seeds are treated with fungicides or biofertilizers before sowing to protect against seed-borne diseases and enhance growth. Planting is usually done in rows spaced 60–75 cm apart with 30–45 cm between plants. The ideal seed rate is 15–20 kg per hectare for non-hybrid varieties and 2–3 kg per hectare for hybrids. Sowing time varies based on region—generally June to July for kharif cotton under rainfed conditions. Fertilizers containing nitrogen, phosphorus, and potassium are applied in balanced quantities to promote healthy growth. Timely weeding, thinning, and intercultural operations are essential to maintain plant population and reduce competition. Crop rotation with legumes helps restore soil fertility and minimize pest buildup. The crop is ready for harvest when bolls burst open, usually 150–180 days after sowing.</p>

          <h4 class="fw-bold mt-3">Soil</h4>

          <h4 class="fw-bold mt-3">Plantation techniques</h4>

          <p>Lentil (Vicia lens or Lens culinaris) is a highly nutritious annual legume known for its lens-shaped edible seeds, commonly called pulses. It is one of the earliest domesticated crops, dating back to 11,000 BC in the Fertile Crescent region. The plant grows to about 30–50 cm in height and bears small pods containing one or two seeds. Lentils are consumed globally, particularly in India, the Middle East, and Mediterranean countries, where they form a dietary staple. They are rich in protein (25–30%), dietary fiber, iron, and B vitamins, making them vital for human nutrition, especially in vegetarian diets. The plant belongs to the Fabaceae family, and like other legumes, it has the ability to fix atmospheric nitrogen through symbiosis with Rhizobium bacteria, improving soil fertility. Lentils are typically self-pollinating, with small white, pink, or light purple flowers. They mature in about 100–120 days and are harvested when the plants turn yellowish-brown. The crop has several types based on seed color and size — red, green, brown, and black lentils being the most common. Each variety differs in taste, cooking quality, and regional adaptation. Lentil cultivation requires minimal water and fertilizers, making it an environmentally sustainable crop. Globally, major producers include Australia, Canada, India, Turkey, and the United States, accounting for over 70% of total production. In India, lentils are a major rabi crop grown in Madhya Pradesh, Uttar Pradesh, Bihar, and West Bengal. The crop is important for both domestic consumption and export. Lentils also improve soil health and serve as an excellent rotational crop before cereals like wheat or barley, enhancing yield and productivity.</p>

          <h4 class="fw-bold mt-3">Climate & Soil</h4>
          <p>Lentil cultivation begins with the selection of quality, disease-free seeds of high-yielding and regionally adapted varieties. Seeds are generally sown directly in the field, either by hand broadcasting or using a seed drill. The ideal sowing time in India is from mid-October to early November for rabi cultivation. Lentils require a fine, firm, and well-prepared seedbed with proper leveling to ensure uniform germination. Ploughing the field 2–3 times followed by harrowing and planking helps in creating an even surface. The recommended seed rate is 30–40 kg per hectare, depending on seed size and soil conditions. Seeds are sown 3–5 cm deep, spaced 20–25 cm apart between rows, ensuring proper air circulation and sunlight. In mechanized farming regions like Canada and Australia, lentils are sown with grain drills, whereas in India, broadcasting followed by light planking is common. Lentils perform well under rainfed or residual soil moisture conditions, but in dry areas, pre-sowing irrigation can help in germination. The crop does not require heavy fertilization; instead, it benefits from biological nitrogen fixation. However, applying 20–25 kg of nitrogen and 40–50 kg of phosphorus per hectare enhances early growth and yield. Intercropping lentil with mustard, linseed, or barley is common to optimize land use and reduce pest infestation. Timely weeding and hoeing are crucial during the first 40 days after sowing to prevent weed competition. Flowering begins around 45–60 days, and pods mature after 100–120 days. Harvesting is done when the lower leaves turn yellow and pods harden. The plants are uprooted or cut near the base and sun-dried before threshing. Proper post-harvest cleaning and grading ensure market-quality lentils ready for storage or export.</p>

          <h4 class="fw-bold mt-3">Irrigation Techniques</h4>
          <p>Lentil grows well in a wide range of soil types but thrives best in well-drained loamy to sandy loam soils with moderate fertility. The crop does not tolerate waterlogging; hence, proper drainage is essential. It performs well in soils with a pH of 6.0–7.5, though slightly alkaline soils can also be suitable. Heavy clay soils and saline or acidic soils are unsuitable due to poor aeration and root development. Lentils are often grown in marginal lands where other crops may not thrive, thanks to their tolerance for drought and low fertility. However, for optimal yield, soils should be rich in organic matter and have good moisture-holding capacity. Before planting, farmers usually prepare the soil through two to three ploughings followed by harrowing to create a fine tilth. Incorporating farmyard manure (FYM) or compost at 10–15 tons per hectare before sowing improves soil structure and fertility. Lentils also benefit from biological nitrogen fixation, where Rhizobium leguminosarum bacteria form nodules on roots and convert atmospheric nitrogen into a usable form, reducing fertilizer requirements. Crop rotation with cereals like wheat or barley enhances soil productivity, while intercropping prevents pest buildup. Since lentils are often cultivated under rainfed conditions, maintaining soil moisture through mulching or conservation tillage is beneficial. Soil testing before sowing helps determine phosphorus and potassium deficiencies, which can be corrected through phosphatic fertilizers (40–50 kg P₂O₅/ha). Lentil roots improve soil structure by increasing organic carbon and microbial activity, leaving the soil enriched for the next crop. Regular monitoring of soil salinity and moisture ensures healthy root growth. Overall, lentil cultivation contributes significantly to soil fertility improvement and sustainable farming systems.</p>

          <h4 class="fw-bold mt-3">Fertilizer & Nutrients</h4>
          <p>Lentil is widely cultivated across Asia, North America, and the Mediterranean regions, with major global producers being Australia, Canada, India, Turkey, and the United States. Together, they contribute over 70% of world lentil production. Australia leads global exports, followed by Canada, which specializes in large green and red lentil varieties. India, being a major consumer and producer, focuses on red and brown lentils, primarily grown as a rabi crop under rainfed conditions. In India, important lentil-growing states include Madhya Pradesh, Uttar Pradesh, Bihar, West Bengal, Rajasthan, and Chhattisgarh. The Indo-Gangetic plains offer ideal conditions for lentil cultivation due to fertile alluvial soil and suitable winter temperatures. Globally, lentils are grown between 30° and 40° latitudes, mainly in semi-arid to temperate climates. In West Asia and North Africa, lentils are grown as a winter crop, while in Canada and the United States, they are cultivated in spring and harvested in summer. In Ethiopia and Turkey, lentil farming has traditional significance and supports food security and export. The crop is also expanding in Nepal and Bangladesh, where it serves as an important pulse in the diet. Lentils can adapt to various altitudes, ranging from sea level to 2,000 meters, depending on the region’s temperature and moisture. Cultivation is most successful in regions with low humidity and well-distributed rainfall (300–500 mm annually). The lentil’s ability to grow in dry zones with minimal input makes it valuable for marginal farmers in drought-prone regions. Additionally, lentils fit well into double-cropping systems, particularly in South Asia, where they follow rice in rotation, utilizing residual soil moisture.</p>

          <h4 class="fw-bold mt-3">Diseases & Management</h4>
          <p>Lentil is primarily a rainfed crop, but strategic irrigation can greatly improve yield, especially in regions with irregular rainfall. It requires light and timely irrigation at critical stages such as flowering and pod formation. Excess water or waterlogging is harmful as it leads to root rot and poor nodulation. Generally, two to three irrigations are sufficient for good yield under semi-arid conditions. The first irrigation is given 30–40 days after sowing, the second during flowering, and the third during pod filling if soil moisture is low. Drip and sprinkler systems are highly effective, as they provide uniform moisture while conserving water. In areas with heavy rainfall or poor drainage, raised-bed planting helps prevent stagnation. Pre-sowing irrigation is also beneficial in dry areas to ensure uniform germination. Lentils respond well to moisture stress management, meaning controlled irrigation results in deeper root growth and better drought resistance. Over-irrigation should be strictly avoided since lentils prefer a moderately dry environment. Maintaining proper soil moisture between 50–70% of field capacity during vegetative and reproductive stages is ideal. In India and other subtropical regions, lentils utilize residual soil moisture from the preceding rice or maize crops, eliminating the need for frequent watering. Farmers often use mulching with crop residues to conserve soil moisture and reduce evaporation. Advanced irrigation scheduling using soil moisture sensors can optimize water use efficiency. Lentil being sensitive to water stress during flowering, any deficiency at this stage can severely affect yield and seed quality. Therefore, even though it’s a low-water crop, timely irrigation combined with proper drainage management ensures consistent productivity and healthy crop development.</p>

          <h4 class="fw-bold mt-3">Best Practices & Tech</h4>
          <p>Lentils thrive in cool, dry climates and are best suited for semi-arid regions with moderate rainfall. The ideal temperature range for germination and early growth is 18–25°C, while 20–30°C is suitable for vegetative and reproductive stages. The crop cannot tolerate frost, high humidity, or excessive rainfall. Lentil prefers clear, sunny days during pod filling and ripening, as cloudiness or prolonged moisture increases the risk of fungal diseases. It requires 300–500 mm of rainfall during its growth period, with most of it distributed evenly. In temperate regions like Canada, lentils are sown in spring and harvested in summer, while in tropical and subtropical regions like India, it is grown as a winter (rabi) crop. In West Asia and North Africa, lentils are planted before snowfall, utilizing melting snow for moisture during growth. In subtropical zones, high temperatures during flowering can lead to flower drop and reduced yield, while low temperatures below 10°C can cause frost damage. Therefore, selecting proper sowing time is critical to ensure optimal temperature during key growth stages. Lentil requires long daylight hours and a dry harvest season to prevent pod shattering and fungal infections. Windy or stormy weather can cause lodging and seed loss. The plant’s deep root system helps it survive mild droughts, making it ideal for rainfed conditions. Lentil varieties have been developed for diverse climatic zones, such as ICARDA’s cold-tolerant and drought-resistant genotypes for arid regions. With changing climatic patterns, lentils are gaining importance as a climate-resilient crop, capable of maintaining productivity under erratic rainfall and rising temperatures.</p>

          <h4 class="fw-bold mt-3">Harvesting & Storage</h4>
          <p>Lentil crops are vulnerable to several fungal, bacterial, and viral diseases that can reduce yield and quality. The most common fungal diseases include Fusarium wilt (Fusarium oxysporum f. sp. lentis), Ascochyta blight (Ascochyta lentis), Anthracnose (Colletotrichum truncatum), Rust (Uromyces viciae-fabae), and Root rot (Rhizoctonia solani). Among these, Fusarium wilt is the most destructive, causing yellowing, wilting, and stunted growth, especially under high soil moisture or poor drainage. Ascochyta blight appears as brown lesions on leaves and pods, often spreading rapidly during humid weather. Anthracnose leads to dark sunken spots on stems and pods, reducing seed quality. Rust causes orange pustules on leaves and stems, while Root rot damages roots, preventing nutrient uptake. Bacterial diseases like bacterial blight and viral infections such as pea seed-borne mosaic virus (PSbMV) also affect lentils but are less common. Effective disease management begins with crop rotation, avoiding repeated lentil planting in the same field for at least 3–4 years. Using disease-free certified seeds and treating them with fungicides like carbendazim or thiram (2–3 g/kg of seed) reduces early infections. Timely weeding, proper spacing, and field sanitation help minimize disease spread. Resistant varieties developed by ICARDA and IIPR (India) have shown good tolerance to wilt and blight. Avoiding overhead irrigation reduces humidity, thus lowering fungal incidence. Infected crop residues should be removed or buried to prevent spore survival. Fungicidal sprays like mancozeb (0.25%) or chlorothalonil (0.2%) can be used at 10–15-day intervals if disease symptoms appear. Integrated Disease Management (IDM) combining resistant varieties, seed treatment, and crop hygiene is the most sustainable approach to keeping lentil diseases under control.</p>

          <h4 class="fw-bold mt-3">Pest control and Management</h4>
          <p>Lentils are susceptible to various insect pests that attack different growth stages, causing direct and indirect yield losses. Major pests include Aphids (Aphis craccivora), Pod borer (Helicoverpa armigera), Cutworms (Agrotis ipsilon), Thrips, and Bruchids (Callosobruchus spp.) in storage. Aphids suck sap from tender shoots and pods, causing leaf curling and transmitting viral diseases. Pod borers damage flowers and pods by boring holes, leading to shriveled seeds. Cutworms feed on young seedlings at ground level, while thrips deform leaves and buds. During storage, bruchids infest dried lentil seeds, reducing market value and viability. Integrated Pest Management (IPM) practices are the most effective approach. These include timely sowing, maintaining field hygiene, and intercropping with mustard or linseed to reduce pest buildup. Regular field monitoring helps in early detection. Spraying neem-based biopesticides (5%) or azadirachtin formulations effectively controls aphids and thrips. For pod borers, using light traps and biological control agents such as Trichogramma chilonis (egg parasitoid) minimizes chemical use. Chemical control should be a last resort; however, if infestation is severe, insecticides like lambda-cyhalothrin (0.005%) or indoxacarb (0.01%) can be applied judiciously. Avoiding excess nitrogen fertilizers and maintaining plant health reduces pest attraction. In storage, dried lentils should be kept below 10% moisture, cleaned thoroughly, and treated with neem leaves or diatomaceous earth to prevent bruchid infestation. Hermetic storage bags also help preserve seed quality. Regular inspection of stored pulses and sun drying them periodically prevents pest multiplication. A combination of biological, cultural, and mechanical practices ensures eco-friendly and sustainable pest management in lentil cultivation.</p>

          <h4 class="fw-bold mt-3">Diseases & Management</h4>

          <h4 class="fw-bold mt-3">Best Practices & Tech</h4>
          <p>Mustard is a cool-season crop that thrives in temperate to subtropical climates. It prefers cool and dry weather for vegetative growth and warm, clear weather for ripening. The optimal temperature range for growth is 10–25°C, with germination occurring best at around 20°C. Extremely high temperatures during flowering and pod filling reduce seed set and oil content, while frost and prolonged cold cause flower damage and pod abortion. Therefore, mustard should be sown at the onset of winter to ensure favorable conditions throughout its growth cycle. The crop requires 400–600 mm of rainfall annually, distributed evenly during early stages but dry conditions at maturity. Cloudy or humid weather during flowering favors fungal diseases like Alternaria blight, so good field ventilation and drainage are essential. In tropical regions, mustard can be grown in higher altitudes where temperatures remain moderate. The crop is sensitive to waterlogging but tolerant to short droughts due to its deep root system. Day length also influences flowering — mustard is a long-day plant, meaning it flowers earlier under longer daylight conditions. Windy weather during pod maturation helps in drying and reduces post-harvest moisture content. For best yields, mustard requires clear skies, low humidity, and dry harvesting conditions. Climate change, however, poses challenges through unpredictable rainfall and rising temperatures, prompting the need for heat-tolerant and early-maturing varieties. In summary, mustard’s success depends on a cool growing season with dry ripening weather and minimal frost exposure.</p>

          <h4 class="fw-bold mt-3">Harvesting & Storage</h4>
          <p>Mustard plants are vulnerable to several fungal, bacterial, and viral diseases that can severely affect yield and quality. The most common is Alternaria blight caused by Alternaria brassicae and A. brassicicola, characterized by dark brown spots on leaves, pods, and stems, leading to premature drying. White rust (Albugo candida) produces white pustules on leaves and floral parts, often deforming inflorescences. Downy mildew (Peronospora parasitica) occurs in cool, humid conditions and appears as yellowish patches with whitish mold on the underside of leaves. Powdery mildew (Erysiphe cruciferarum) forms a white powdery coating, reducing photosynthesis. Sclerotinia stem rot is another major disease that causes soft rot at the base of the stem and plant collapse. Bacterial diseases like leaf spot and black rot may also appear under high humidity. To manage these, crop rotation with non-cruciferous crops, removal of infected debris, and deep plowing are essential. Seed treatment with fungicides such as Thiram (2.5 g/kg seed) or Carbendazim prevents early infection. Foliar sprays of Mancozeb or Propiconazole at 10–15-day intervals control fungal spread. Use of disease-resistant varieties, timely sowing, and proper plant spacing ensure adequate air circulation and reduce disease incidence. Avoiding excessive nitrogen fertilizer also minimizes lush growth, which favors fungal attack. Integrated disease management combining cultural, biological, and chemical measures provides the best long-term solution. Healthy seed selection and sanitation are crucial for preventing disease carryover.</p>

          <h4 class="fw-bold">Overview</h4>
          <p>Sesame (Sesamum indicum), often referred to as benne, is one of the world’s oldest known oilseed crops, domesticated over 3,000 years ago. Belonging to the family Pedaliaceae, it is widely grown across tropical and subtropical regions. The plant is prized for its small, flat, nutrient-rich seeds that contain about 50% oil and 18–20% protein, making it an essential source of edible oil and plant-based nutrition. Sesame oil is valued for its rich, nutty flavor, long shelf life, and medicinal benefits. The crop is known for its resilience to drought, allowing cultivation in regions where other crops may fail. Its origin traces back to India and parts of sub-Saharan Africa, from where it spread through trade to the Middle East, Asia, and beyond. Archaeological evidence suggests its cultivation in the Indus Valley Civilization around 3000 BCE. Sesame plays an important role in traditional diets, especially in Asia and Africa, where it is used for oil extraction, culinary preparations, and confectionery. Globally, countries like Sudan, Myanmar, and India are the top producers, contributing nearly half of the world’s supply. The plant is also eco-friendly, requiring minimal inputs and thriving even in poor soils. The seeds come in various colors, including white, brown, and black, with slight variations in flavor and oil content. In addition to food uses, sesame oil is utilized in cosmetics, pharmaceuticals, and ayurvedic products. Due to its drought tolerance, nutritional value, and global demand, sesame is often called the “queen of oilseeds.” It is a profitable crop for small and marginal farmers, offering both food and economic security, particularly in rainfed agricultural systems across developing regions.</p>

          <h4 class="fw-bold mt-3">Climate & Soil</h4>
          <p>The cultivation of sesame begins with selecting suitable land and preparing it thoroughly for planting. The soil should be plowed two to three times to create a fine tilth and ensure good aeration. The field is leveled and divided into plots with proper drainage channels since sesame is highly sensitive to waterlogging. Before sowing, seeds are treated with fungicides like Thiram or Carbendazim (2–3 g per kg of seed) to prevent soil-borne diseases. Sowing is typically done through broadcasting or line sowing methods, depending on the scale of cultivation. Line sowing, with spacing of 25–30 cm between rows and 10–15 cm between plants, is preferred for better growth and management. Around 3–5 kg of seeds per hectare are sufficient for uniform plant density. Sesame can be cultivated both as a kharif and rabi crop, depending on the region. In India, sowing is generally done from June to July for kharif and from October to November for rabi seasons. The crop is light in nutrient demand but responds well to organic manure and balanced fertilization. Applying farmyard manure (5–10 tons per hectare) before sowing and a dose of 30–40 kg nitrogen, 20 kg phosphorus, and 20 kg potassium ensures better yield and oil content. Regular weeding is crucial, especially during the first 30 days, as sesame plants grow slowly at early stages and cannot compete with weeds. Intercultural operations like thinning and hoeing improve aeration and root development. The crop matures in about 80–120 days, depending on the variety. Harvesting is done when most of the capsules turn yellow and begin to dry. Plants are cut, tied in bundles, and sun-dried before threshing to extract seeds. Proper post-harvest drying prevents seed spoilage and ensures high-quality oil production.</p>

          <h4 class="fw-bold mt-3">Irrigation Techniques</h4>
          <p>Sesame is adaptable to various soil types but performs best in well-drained, fertile sandy loam or loamy soils rich in organic matter. The ideal soil pH ranges between 6.0 and 7.5. Heavy clay soils or saline, alkaline, and poorly drained soils are unsuitable because the sesame plant is highly sensitive to water stagnation, which can cause root rot and yield reduction. The soil should be loose and well-aerated to support the extensive root system that enables drought resistance. Prior to planting, deep plowing followed by two to three harrowings ensures proper tilth and removal of weeds. Incorporation of farmyard manure or compost (around 8–10 tons per hectare) improves soil fertility, moisture retention, and microbial activity. Green manuring with legumes like cowpea or sunn hemp is also recommended in crop rotations to enhance soil nitrogen levels. In regions with nutrient-depleted soils, balanced fertilization is important. Application of nitrogen, phosphorus, and potassium in the ratio of 40:20:20 kg/ha boosts growth and oil content. Micronutrients like sulfur, zinc, and boron are also beneficial, as their deficiency can reduce oil yield. Soil testing before cultivation helps determine nutrient requirements and correct deficiencies. To prevent soil erosion, sesame should be planted along contour lines in sloping areas. Proper field drainage is essential because sesame plants cannot withstand prolonged wet conditions. Mulching with crop residues or dry leaves conserves moisture and improves soil temperature, especially in dry zones. Crop rotation with cereals or legumes is advisable to avoid soil-borne diseases. In summary, light, friable, and well-drained soils with moderate fertility and proper organic content provide ideal conditions for sesame cultivation, ensuring high seed yield and superior oil quality while maintaining long-term soil health and productivity.</p>

          <h4 class="fw-bold mt-3">Fertilizer & Nutrients</h4>

    <p>Turmeric (Curcuma longa L.) is a perennial herb belonging to the Zingiberaceae (ginger) family. It is widely cultivated in tropical and subtropical regions, primarily in India, Southeast Asia, and parts of Africa. The plant grows from underground rhizomes, which are harvested and processed into the golden-yellow spice known globally as turmeric powder. Turmeric has been an integral part of Indian culture for over 4,000 years—used in cuisine, traditional medicine, dyeing, and religious rituals. It grows up to one meter tall and produces large green leaves and pale yellow flowers. The rhizomes are aromatic, containing curcuminoids, particularly curcumin, which give turmeric its color and medicinal properties. The crop is mainly grown for its rhizomes, which are boiled, dried, and ground into powder. India is the world’s largest producer, consumer, and exporter of turmeric, with major cultivation in Andhra Pradesh, Tamil Nadu, Odisha, Karnataka, and Maharashtra. Turmeric is valued for its antioxidant, antibacterial, and anti-inflammatory properties and plays a major role in Ayurveda and Siddha medicine. Modern research continues to explore curcumin’s potential in pharmaceuticals, cosmetics, and nutraceuticals. Despite its health benefits, turmeric cultivation remains labor-intensive, requiring suitable soil, irrigation, and pest management practices for high yields and quality rhizome production.</p>

    <h4 class="fw-bold mt-3">Plantation Techniques</h4>
    <p>Turmeric is propagated vegetatively through rhizomes rather than seeds. Healthy, disease-free mother rhizomes are selected for planting. The field is ploughed 3–4 times to achieve fine tilth, and 20–25 tons of farmyard manure per hectare are incorporated before planting. Rhizomes are cut into small pieces (4–5 cm long) with at least one viable bud each. Planting is generally done at the onset of monsoon—June to July in India. The spacing recommended is 30 cm × 25 cm between rows and plants, ensuring adequate growth and aeration. The rhizomes are planted 5–7 cm deep in ridges or furrows. Mulching with green leaves after planting helps conserve moisture, suppress weeds, and encourage sprouting. The second and third mulching are done at 45 and 90 days after planting. Fertilization typically involves 60–80 kg of nitrogen, 50 kg phosphorus, and 120 kg potassium per hectare applied in split doses. Regular weeding and earthing up enhance rhizome development. Intercropping with ginger, maize, or chillies can improve land utilization and prevent soil-borne diseases. Harvesting is done 7–9 months after planting when leaves start yellowing and drying. The rhizomes are carefully dug, cleaned, boiled, and sun-dried before being polished and stored for market or seed use.</p>

    <h4 class="fw-bold mt-3">Soil</h4>
    <p>Turmeric grows best in well-drained, fertile loamy or alluvial soils rich in organic matter. Heavy clay soils are unsuitable as they retain water, causing rhizome rot. Sandy loam soils are ideal for better aeration and root expansion. The optimum pH range is 5.0 to 7.5, though the crop tolerates slightly acidic conditions. Soil preparation involves deep ploughing and leveling to ensure proper drainage, as waterlogging severely affects yield. Before planting, farmyard manure or compost is mixed thoroughly to enrich soil fertility. Application of green manure crops like sun hemp or cowpea before turmeric planting enhances soil structure and microbial activity. Crop rotation is essential; turmeric should not be grown continuously in the same field to prevent pest and disease buildup. Phosphorus aids in root development, while potassium improves rhizome weight and quality. Sulfur-rich soil enhances curcumin content, giving the rhizomes better color and aroma. Periodic soil testing helps maintain nutrient balance and pH levels. Mulching and organic amendments maintain soil temperature and moisture, ensuring a conducive environment for rhizome growth. Proper soil management leads to improved yield, superior quality, and higher curcumin concentration.</p>

    <h4 class="fw-bold mt-3">Region</h4>
    <p>Turmeric cultivation thrives in tropical and subtropical regions with high humidity and well-distributed rainfall. In India, major producing states include Andhra Pradesh, Tamil Nadu, Karnataka, Odisha, Maharashtra, and West Bengal. Erode in Tamil Nadu and Sangli in Maharashtra are known as “Turmeric Cities.” Globally, it is grown in Bangladesh, Sri Lanka, Myanmar, Indonesia, and Thailand. India accounts for nearly 80% of the world’s turmeric production and 60% of exports. Regional suitability depends on temperature, rainfall, and soil conditions. In southern India, it is grown both under rainfed and irrigated conditions, while in northern India, it is cultivated during the kharif season. The crop performs best at altitudes below 1,500 meters where temperatures remain between 20°C–30°C. Regions with moderate rainfall followed by dry spells during maturity ensure better rhizome quality. Export-oriented varieties like “Rajapuri,” “Salem,” and “Erode” are grown in specific zones due to their high curcumin and oleoresin content. Regional adaptation, use of high-yield hybrids, and government-backed turmeric clusters have significantly boosted India’s position in the global spice market.</p>

    <h4 class="fw-bold mt-3">Irrigation Techniques</h4>
    <p>Turmeric requires consistent moisture throughout its growing season, particularly during sprouting and rhizome formation stages. In irrigated areas, water is supplied every 7–10 days during dry periods. Both furrow and drip irrigation systems are practiced. Drip irrigation is preferred for its water efficiency—it delivers water directly to the root zone, reducing evaporation and disease incidence. Sprinkler irrigation may be used during the early growth stages for uniform germination but should be avoided later to prevent fungal growth. In rainfed regions, mulching and organic matter help retain soil moisture. The first irrigation is done immediately after planting, followed by regular intervals depending on weather and soil type. Excess water must be drained quickly to avoid rhizome rot. Critical irrigation periods include 40–90 days after planting when rhizomes develop actively. Stopping irrigation 15–20 days before harvest helps in curing and drying. Efficient irrigation management improves yield quality, increases curcumin concentration, and reduces input costs, ensuring sustainable production.</p>

    <h4 class="fw-bold mt-3">Climate</h4>
    <p>Turmeric is a tropical crop that thrives in warm and humid conditions. The ideal temperature range for growth is 20°C–30°C, and the crop requires 1,500–2,000 mm of annual rainfall for optimal yield. It is sensitive to frost and prolonged drought. During early stages, humid and warm conditions favor vegetative growth, while a dry period during maturity enhances rhizome development. Turmeric requires about 8–10 months from planting to harvest. Areas with high humidity during sprouting and well-distributed rainfall followed by sunshine during maturation are best suited. Shade-tolerant varieties can grow under partial sunlight, making turmeric suitable for intercropping. Monsoon planting ensures natural moisture for sprouting, while controlled irrigation supports growth in dry zones. Prolonged water stagnation or low temperatures reduce rhizome yield and curcumin content. Selecting suitable varieties for local climatic conditions ensures stable and high-quality production throughout the growing season.</p>

    <h4 class="fw-bold mt-3">Diseases</h4>
    <p>Turmeric is prone to several fungal and bacterial diseases that affect yield and quality. Rhizome rot (Pythium graminicolum) is the most serious, causing yellowing and decay of rhizomes under waterlogged conditions. Leaf blotch (Taphrina maculans) and leaf spot (Colletotrichum capsici) cause brown lesions, reducing photosynthesis. Fusarium wilt and bacterial soft rot also occur in poorly drained soils. Shoot borer (Conogethes punctiferalis) larvae damage pseudostems, while nematodes attack roots. Preventive measures include crop rotation, seed treatment with fungicides (Mancozeb or Carbendazim), and using disease-free rhizomes. Proper drainage and field hygiene are essential to minimize infections. Organic control measures like Trichoderma harzianum and neem cake application are effective eco-friendly alternatives. Timely detection and integrated disease management significantly reduce losses and maintain rhizome quality.</p>

    <h4 class="fw-bold mt-3">Pest Control and Management</h4>
    <p>Turmeric is affected by pests like shoot borer, rhizome scale, aphids, and nematodes. The shoot borer damages the central shoot, leading to “dead hearts.” Removing infested plants and applying neem oil or biological control agents helps. Rhizome scale insects suck sap from the rhizome, causing shriveling; these are managed using soil solarization and neem cake application. Nematodes cause stunted growth and can be controlled by rotating crops with legumes. Regular weeding, clean seed rhizomes, and maintaining soil moisture balance are crucial preventive steps. Integrated Pest Management (IPM) combining cultural, mechanical, and biological methods ensures sustainable pest control. Avoiding excessive chemical pesticide use preserves soil health and enhances turmeric quality for export standards.</p>
